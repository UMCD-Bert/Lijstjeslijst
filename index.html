<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lijster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lijster">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6F5E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #EFF1EA;
    --surface: #FBFBF7;
    --surface-2: #E4E7DD;
    --ink: #232620;
    --muted: #6E7266;
    --accent: #2F6F5E;
    --accent-ink: #F4F8F5;
    --accent-soft: #DCEAE3;
    --danger: #B5482F;
    --danger-soft: #F3E1DA;
    --border: #D8DBCF;
    --shadow: rgba(35,38,32,0.10);
    --focus: #2F6F5E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
      --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
      --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
    --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
    --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
  }

  * { box-sizing: border-box; }
  /* Alleen op `html`, NIET ook op `body` — een niet-`visible` `overflow` op `body` maakt `body` zelf
     een "scroll-container" voor `position: sticky` (ook al scrollt `body` zelf helemaal nooit, want
     `html` is hier het echte scrollende element), waardoor sticky-elementen daarbinnen (zoals de
     A-Z-sprongbalk) nooit gaan "plakken". `html`'s overflow propageert naar de viewport (voorkomt
     dus nog steeds dat de hele pagina horizontaal kan schuiven), zonder dit sticky-lek. */
  html { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 90px; padding-top: calc(32px + env(safe-area-inset-top)); }
  @media (min-width: 640px) { .wrap { padding: 40px 28px 90px; padding-top: calc(40px + env(safe-area-inset-top)); } }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  h1.brand { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  p.tagline { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; font-style: italic; font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 11px 18px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 2px var(--shadow); transition: transform 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px var(--shadow); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-secondary {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 14px; font-size: 0.85rem; font-weight: 500;
  }
  .btn-secondary:hover { background: var(--accent-soft); }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 0.86rem; padding: 6px 4px; }
  .btn-text:hover { color: var(--ink); }
  .btn-text.danger { color: var(--danger); }
  .btn-text.danger:hover { text-decoration: underline; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 0.82rem; padding: 4px 2px; align-self: flex-start; font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  main { position: relative; }
  [hidden] { display: none !important; }

  /* ---- Overview grid ---- */
  #grid { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 2px var(--shadow); cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; transition: transform 0.15s ease, box-shadow 0.15s ease; text-align: left; color: inherit;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 18px var(--shadow); }
  .card-cover { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex-shrink: 0; background: var(--surface-2); }
  .card-cover-placeholder {
    width: 52px; height: 52px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.3rem; color: var(--muted);
  }
  .card-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.02rem; margin: 0; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { display: flex; align-items: center; gap: 8px; }
  .pill { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .count-tag { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .card-controls { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 27px; height: 27px; border-radius: 7px; border: none; background: rgba(251,251,247,0.9); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; box-shadow: 0 1px 3px var(--shadow); flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface); }
  .icon-btn-accent { color: var(--accent); }
  .icon-btn-accent:hover { color: var(--accent); background: var(--accent-soft); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

  .ghost-card { border: 1.5px dashed var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); grid-column: 1 / -1; }
  .ghost-card h3 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; }
  .template-choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .template-btn {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 9px;
    padding: 9px 14px; font-size: 0.86rem; font-weight: 500; display: flex; flex-direction: column; gap: 2px; text-align: left;
  }
  .template-btn small { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
  .template-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row label { font-size: 0.76rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row input, .field-row textarea {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 9px 11px;
    font-family: inherit; font-size: 16px; color: var(--ink); resize: vertical;
  }
  .field-row input:focus, .field-row textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .ghost-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state p.big { font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem; color: var(--ink); margin: 0 0 6px; }

  /* ---- Detail view ---- */
  /* Geen `overflow: hidden` hier (had eerder alleen als doel om de omslagfoto's bovenhoeken af te
     ronden samen met de kaart) — dat breekt `position: sticky` voor alles daarbinnen die relatief
     aan de PAGINA-scroll moet blijven hangen (zoals de A-Z-sprongbalk hieronder): elke voorouder met
     een `overflow` anders dan `visible` wordt de nieuwe "sticky-context", en aangezien deze kaart
     zelf geen vaste hoogte heeft (dus nooit intern hoeft te scrollen), zou sticky daarbinnen dan
     nooit daadwerkelijk gaan "plakken". De omslagfoto rondt zijn eigen bovenhoeken nu zelf af.
  */
  #detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px var(--shadow); }

  .cover-area { position: relative; width: 100%; }
  .cover-img { width: 100%; max-height: 260px; object-fit: cover; display: block; background: var(--surface-2); border-radius: 15px 15px 0 0; }
  .cover-actions { position: absolute; bottom: 10px; right: 12px; display: flex; gap: 8px; }
  .cover-actions .btn-secondary { background: rgba(251,251,247,0.92); }

  .detail-body { padding: 18px 24px 26px; }
  .detail-head { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; flex-wrap: wrap; }
  .detail-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.55rem; margin: 0; padding: 4px 2px; border: none;
    background: transparent; color: var(--ink); flex: 1 1 auto; min-width: 120px; }
  .detail-title:focus { outline: none; border-bottom: 1.5px solid var(--accent); }
  .detail-meta { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; flex-wrap: wrap; }
  .stat-cards { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
  .stat-card {
    background: var(--surface-2); border-radius: 10px; padding: 7px 12px; display: flex; flex-direction: column;
    gap: 1px; min-width: 56px;
  }
  .stat-card-value { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.15rem; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat-card-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  hr.div { border: none; border-top: 1px solid var(--border); margin: 4px 0 14px; }

  .fields-toggle-row { margin-bottom: 4px; }

  .fields-editor { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 16px; }
  .fields-editor h4 { margin: 0 0 8px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  .fields-editor-group { display: flex; flex-direction: column; gap: 6px; }
  .fields-editor-row { display: flex; align-items: center; gap: 8px; }
  .fields-editor-row input { flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .fields-editor-desc { width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 8px 10px; font-family: inherit; font-size: 16px; color: var(--ink); resize: vertical; }

  .mode-tabs { display: flex; gap: 6px; margin: 0 0 14px; border-bottom: 1px solid var(--border); }
  .mode-tab-btn {
    border: none; background: none; padding: 8px 4px; margin-right: 14px; font-family: inherit; font-size: 0.9rem;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
  }
  .mode-tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .search-sort-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 14px; }
  .search-input-wrap { position: relative; flex: 1; min-width: 140px; }
  .search-input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 8px 30px 8px 12px; font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; background: none; color: var(--muted);
    font-size: 1.1rem; line-height: 1; cursor: pointer; border-radius: 50%;
  }
  .search-clear-btn:hover, .search-clear-btn:active { background: var(--surface-2); color: var(--ink); }
  .sort-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .sort-select {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 9px;
    font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .filter-chip {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px;
    padding: 6px 13px; font-size: 0.8rem; font-weight: 500; white-space: nowrap;
  }
  .filter-chip-wel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .filter-chip-niet { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .az-bar {
    display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; margin: 0 0 12px;
    /* `top: env(safe-area-inset-top)` i.p.v. `0` — anders plakt de balk op een standalone PWA (met
       `black-translucent` statusbalk, zie manifest) precies ONDER/ACHTER de iPhone-statusbalk
       (tijd/batterij/wifi), niet erbuiten, en zijn de letters onleesbaar tegen die iconen aan. */
    position: sticky; top: env(safe-area-inset-top); z-index: 5; background: var(--surface);
  }
  .az-btn {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--ink); font-size: 0.76rem; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .az-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .import-toggle-row { margin-bottom: 14px; }
  .import-panel { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .import-search { display: flex; gap: 8px; }
  .import-search input { flex: 1; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 11px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .import-candidates { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .import-candidate { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 11px; font-size: 0.86rem; }
  .import-candidate:hover { background: var(--accent-soft); }
  .import-candidate small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .import-candidate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .import-candidate-row .btn-text { flex-shrink: 0; padding: 4px 2px; }
  .import-works { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .import-work-row { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; padding: 3px 0; }
  .import-work-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .import-work-thumb { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .import-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .import-select-row { display: flex; gap: 14px; margin: -6px 0 4px; }
  .import-msg { font-size: 0.84rem; color: var(--muted); font-style: italic; }
  /* Bewust GEEN italic/losse regel tussen de knoppen in — dat oogde als een derde, gelijkwaardige
     keuze in een rijtje knoppen i.p.v. een algemene tip die overal in de vorm geldt (concreet
     gemeld: "niet duidelijk dat ik overal Cmd-V kon drukken"). Nu met een klein pictogram + een
     subtiele achtergrond, duidelijk los van de knoppenrij. */
  .paste-hint { display: flex; align-items: center; gap: 5px; flex: 1 1 100%; font-size: 0.78rem; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 5px 9px; margin-top: 4px; }
  .paste-hint svg { flex-shrink: 0; opacity: 0.8; }
  .import-msg a { color: var(--accent); }
  .cover-search-row { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  .cover-search-msg { font-size: 0.84rem; color: var(--muted); font-style: italic; }
  .cover-search-candidates { display: flex; flex-wrap: wrap; gap: 10px; }
  .cover-search-candidate { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px; text-align: center; }
  .cover-search-candidate:hover { background: var(--accent-soft); }
  .cover-search-candidate img { width: 100%; height: 84px; object-fit: cover; border-radius: 4px; }
  .cover-search-candidate small { font-size: 0.72rem; color: var(--muted); line-height: 1.2; }
  .import-msg.error { color: var(--danger); font-style: normal; }
  .track-search-row { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  .track-candidates { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .track-candidate-btn {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline; width: 100%;
    text-align: left; border: none; background: none; padding: 7px 4px; border-radius: 6px;
    font-size: 0.86rem; font-family: inherit; color: var(--ink); cursor: pointer;
  }
  .track-candidate-btn:hover { background: var(--accent-soft); }
  .track-candidate-btn .tc-meta { color: var(--muted); font-size: 0.78rem; flex-shrink: 0; white-space: nowrap; }
  .track-confirm-preview { display: flex; gap: 12px; align-items: flex-start; }
  .track-confirm-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex-shrink: 0; }
  .track-confirm-tracklist { white-space: pre-wrap; font-size: 0.82rem; color: var(--ink); max-height: 220px; overflow-y: auto; flex: 1; margin: 0; }

  .reeks-row td { padding: 16px 4px 8px; border-bottom: none; }
  .reeks-row:first-child td { padding-top: 4px; }
  /* Rijen die colSpan="colCount" gebruiken (reeks-kop, bewerk-form, cover-/tracklist-zoeken) erven
     anders de volledige (JS-berekende, vaak bredere-dan-viewport) tabelbreedte — met alleen
     `overflow-x:auto` op `.items-scroll` blijft hun inhoud dan onzichtbaar totdat je toevallig naar
     rechts scrolt (bv. "Jaar van uitgave" bij Muziek/Strips, met hun extra vinkjes-kolommen, viel
     zo volledig buiten beeld op iPhone). `position:sticky;left:0` houdt zo'n rij bij de zichtbare
     linkerrand, en `max-width` (viewportbreedte min de vaste `.wrap`/`.detail-body`-marges) zorgt
     dat de al aanwezige `flex-wrap` ook echt naar een nieuwe regel omslaat i.p.v. verder door te
     lopen buiten beeld. */
  .wide-row-content { position: sticky; left: 0; max-width: calc(100vw - 88px); box-sizing: border-box; }
  @media (min-width: 640px) { .wide-row-content { max-width: calc(100vw - 96px); } }
  .reeks-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .reeks-collapse-btn { width: 20px; height: 20px; border: none; background: none; color: var(--muted); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0; font-size: 0.8rem; line-height: 0; }
  .reeks-collapse-btn:hover { color: var(--ink); }
  .reeks-name-input { flex: 1 1 120px; min-width: 100px; border: none; background: transparent; font-family: 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 1rem; color: var(--ink); padding: 3px 5px; border-radius: 6px; }
  .reeks-name-input:focus { outline: none; background: var(--surface-2); }
  .reeks-label-plain { flex: 1; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1rem; color: var(--muted); padding: 3px 5px; }

    var vinkjesFieldset = buildVinkjesFieldset(entry.vink_velden, null);

    var actions = document.createElement('div'); actions.className = 'edit-form-actions';
    var submitBtn = document.createElement('button');

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'btn-text'; cancelBtn.textContent = 'Annuleren';
    cancelBtn.addEventListener('click', function () { setViewMode(entry, 'bekijken'); });
    actions.appendChild(submitBtn); actions.appendChild(cancelBtn);
    form.appendChild(actions);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var titel = titelInput.value.trim();
      if (!titel) return;
      var reeksNaam = reeksInput.value.trim();
      if (!reeksNaam) { reeksInput.focus(); return; }
      var reeksRes = await findOrCreateReeks(entry, reeksNaam);
      if (reeksRes.error || !reeksRes.data) { console.error(reeksRes.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      var extra = {};
      (entry.extra_velden || []).forEach(function (f, i) { extra[f.key] = extraInputs[i].value.trim() || null; });
      var vinkjes = vinkjesFieldset.values();
      var result = await supabase.from('lijst_items').insert({
        lijst_id: entry.id, titel: titel, extra: extra, vinkjes: vinkjes, reeks_id: reeksRes.data.id, volgorde: Date.now()
      }).select().single();
      if (result.error || !result.data) { console.error(result.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      delete state.collapsedReeks[reeksRes.data.id];
      var newItemId = result.data.id;
      await refetchAll();
      flashItemRow(newItemId);
      showAddConfirmation(entry, '"' + titel + '" toegevoegd bij ' + reeksRes.data.naam + '.');
      var freshTitel = detailCardEl.querySelector('.genest-add-form input[placeholder="Titel"]');
      if (freshTitel) freshTitel.focus();
    });

    wrap.appendChild(form);
    if (state.addConfirm[entry.id]) {
      var confirmP = document.createElement('p'); confirmP.className = 'add-confirm'; confirmP.textContent = state.addConfirm[entry.id];
      wrap.appendChild(confirmP);
    }

  }

  // ---------- Boek toevoegen op ISBN (Open Library) ----------
  function newIsbnLookupState() {
    return { step: 'input', isbn: '', loading: false, error: '', book: null, reeksId: '', newReeksNaam: '' };
  }

  async function isbnSearch(entry) {
    var lk = state.isbnLookup[entry.id];
    var isbn = (lk.isbn || '').replace(/[^0-9Xx]/g, '');
    if (!isbn) { lk.error = 'Vul een ISBN in.'; renderDetail(); return; }
    var existing = itemsFor(entry.id).find(function (i) { return i.extern_id === isbn; });
    if (existing) { lk.error = 'Dit ISBN staat al in de lijst ("' + existing.titel + '").'; renderDetail(); return; }
    lk.loading = true; lk.error = ''; renderDetail();
    try {
      var res = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + encodeURIComponent(isbn) + '&jscmd=data&format=json');
      var data = await res.json();
      var rec = data['ISBN:' + isbn];
      if (!rec) { lk.error = 'Geen boek gevonden voor dit ISBN.'; return; }
      var author = (rec.authors && rec.authors[0] && rec.authors[0].name) || '';
      var matched = author ? findReeksByNaam(entry, author) : null;
      var yearMatch = (rec.publish_date || '').match(/\d{4}/);
      lk.book = {
        isbn: isbn, title: rec.title || '(onbekende titel)', author: author,
        cover: (rec.cover && (rec.cover.medium || rec.cover.large || rec.cover.small)) || null,
        year: yearMatch ? yearMatch[0] : null
      };
      lk.reeksId = matched ? String(matched.id) : '__new__';
      lk.newReeksNaam = author;
      lk.step = 'result';
    } catch (e) {
      console.error('isbn lookup failed', e);
      lk.error = 'Opzoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      lk.loading = false; renderDetail();
    }
  }

  async function isbnCommit(entry) {
    var lk = state.isbnLookup[entry.id];
    var book = lk.book;
    var reeksId = lk.reeksId;
    if (reeksId === '__new__') {
      var naam = (lk.newReeksNaam || '').trim();
      if (!naam) return;
      var reeksRes = await addReeks(entry, naam);
      if (reeksRes.error || !reeksRes.data) { console.error(reeksRes.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      reeksId = reeksRes.data.id;
    }
    var vinkjes = {};
    (entry.vink_velden || []).forEach(function (vk) { vinkjes[vk.key] = false; });
    var extra = {};
    if (book.year && (entry.extra_velden || []).some(function (f) { return f.key === 'jaar'; })) extra.jaar = book.year;
    var result = await supabase.from('lijst_items').insert({
      lijst_id: entry.id, titel: book.title, extra: extra, vinkjes: vinkjes, reeks_id: reeksId,
      bron: 'openlibrary', extern_id: book.isbn, omslag_url: book.cover || null, volgorde: Date.now()
    });
    delete state.isbnLookup[entry.id];
    refetchSoft(result);
  }

  // ---------- Detail ----------
  function openDetail(id) {

    detailEl.hidden = false; gridEl.hidden = true; emptyStateEl.hidden = true; newListBtn.hidden = true;
    appHeaderEl.hidden = true;

  function goHome() {
    state.currentId = null; state.importFlow = null;

    appHeaderEl.hidden = false;

  }

    var dbody = document.createElement('div');
    dbody.className = 'detail-body';

    var head = document.createElement('div');
    head.className = 'detail-head';
    var backBtn = document.createElement('button');
    backBtn.type = 'button'; backBtn.className = 'icon-btn'; backBtn.innerHTML = '&#8592;';
    backBtn.setAttribute('aria-label', 'Alle lijstjes'); backBtn.title = 'Alle lijstjes';

    var titleInput = document.createElement('input');

    }
    dbody.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'detail-meta';
    var pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = entry.type_label || 'Lijst';
    meta.appendChild(pill);
    dbody.appendChild(meta);

    // Kaartjes i.p.v. een platte teksregel met tellertjes — geeft meteen een "overzicht van je
    // collectie"-gevoel bij het openen, zonder nieuwe data (dezelfde aantallen als voorheen).
    var allEntryItems = itemsFor(entry.id);
    var statCards = document.createElement('div'); statCards.className = 'stat-cards';
    function addStatCard(value, label) {
      var card = document.createElement('div'); card.className = 'stat-card';
      var v = document.createElement('span'); v.className = 'stat-card-value'; v.textContent = value;
      var l = document.createElement('span'); l.className = 'stat-card-label'; l.textContent = label;
      card.appendChild(v); card.appendChild(l);
      statCards.appendChild(card);
    }
    addStatCard(String(allEntryItems.length), allEntryItems.length === 1 ? 'item' : 'items');
    if (entry.genest) {
      var reeksenCount = reeksenFor(entry.id).length;
      addStatCard(String(reeksenCount), 'reeksen');
    }
    (entry.vink_velden || []).forEach(function (vk) {
      var vc = vinkCounts(entry.id, vk.key);
      addStatCard(vc.total ? (vc.yes + '/' + vc.total) : '0', vk.label.toLowerCase());
    });
    dbody.appendChild(statCards);

    if (state.showFieldsEditor) dbody.appendChild(renderFieldsEditor(entry));

    dbody.appendChild(document.createElement('hr')).className = 'div';

    dbody.appendChild(renderModeTabs(entry));
    var viewMode = state.viewMode[entry.id] || 'bekijken';
    if (viewMode === 'bekijken') {
      dbody.appendChild(renderSearchSortRow(entry));
      if ((entry.vink_velden || []).length && (!!state.showFilters[entry.id] || hasActiveFilter(entry))) {
        dbody.appendChild(renderFilterRow(entry));
      }
    } else if (viewMode === 'toevoegen') {
      if (entry.auto_import && (!entry.genest || entry.auto_import === 'discogs')) dbody.appendChild(renderImportSection(entry));
    }

    var fullItems = itemsFor(entry.id);
    var items = filteredItems(entry);
    var manualOrder = currentSortKey(entry) === 'volgorde';
    var vinkVelden = entry.vink_velden || [];
    var colCount = 1 + vinkVelden.length;

    function buildThead() {
      if (!vinkVelden.length) return null;
      var thead = document.createElement('thead');
      var headRow = document.createElement('tr');
      var titleTh = document.createElement('th');
      titleTh.className = 'col-title col-title-head';
      headRow.appendChild(titleTh);
      vinkVelden.forEach(function (vk) {
        var th = document.createElement('th');
        th.className = 'col-check'; th.textContent = vk.label;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      return thead;
    }

    // Een `position:sticky;top` op de echte `<thead>` zelf werkt hier NIET: `.items-scroll` heeft
    // `overflow-x:auto`, en de CSS-spec dwingt `overflow-y` dan óók naar een niet-`visible` waarde
    // (zelfs als je 'm expliciet op `visible` zet) — waardoor `.items-scroll` zélf een scroll-
    // container wordt voor `position:sticky`-nakomelingen, ook al scrolt het in de praktijk nooit
    // verticaal (geen vaste hoogte). Precies het patroon uit werkafspraak 12 (v1.28.0, toen met
    // `overflow-x:hidden` op `body`), hier bevestigd door de sticky-positie vóór/na scrollen te
    // meten i.p.v. er alleen naar te kijken (top bleef gewoon meebewegen i.p.v. te "vastplakken").
    // Oplossing: de echte `<thead>` blijft in de tabel (puur voor tabelstructuur/toegankelijkheid
    // — een `<table>` hoort er een te hebben) maar wordt visueel verborgen (`.sr-only`, dezelfde
    // "clip"-techniek als screenreader-only tekst elders gebruikelijk is), en een APARTE
    // "mirror"-koprij staat BUITEN `.items-scroll` (dus in de normale pagina-scroll-flow, waar
    // sticky wél werkt) met zijn eigen horizontale scroll die in JS gesynchroniseerd wordt met de
    // echte tabel — hetzelfde idee als `applyWideRowContentWidths()` hierboven (breedtes meten
    // i.p.v. schatten), nu toegepast op scrollpositie i.p.v. breedte.
    function buildTheadMirror() {
      if (!vinkVelden.length) return null;
      var mirror = document.createElement('div');
      mirror.className = 'thead-mirror';
      var row = document.createElement('div');
      row.className = 'thead-mirror-row';
      row.style.width = (180 + vinkVelden.length * 54) + 'px';
      var spacer = document.createElement('div');
      spacer.className = 'thead-mirror-spacer col-title';
      row.appendChild(spacer);
      vinkVelden.forEach(function (vk) {
        var cell = document.createElement('div');
        cell.className = 'col-check thead-mirror-th'; cell.textContent = vk.label;
        row.appendChild(cell);
      });
      mirror.appendChild(row);
      return mirror;
    }

    function buildTableShell() {
      var scrollWrap = document.createElement('div');
      scrollWrap.className = 'items-scroll';
      var table = document.createElement('table');
      table.className = 'items-table';
      // Geen `+ 90` meer — dat was gereserveerd voor de acties-kolom, die sinds v1.26.0 niet meer
      // los bestaat (acties staan nu IN de titelkolom, zie hierboven). Die vestigiale +90px bleef
      // de tabel onnodig breed maken, wat bij weinig vinkjes (bv. Bordspellen: alleen "Gespeeld")
      // de titelkolom tot z'n max-width opblies en het ene vinkje-kolom volledig buiten beeld duwde
      // — pas op na scrollen zichtbaar (gemeld met een iPhone-screenshot).
      table.style.minWidth = (180 + vinkVelden.length * 54) + 'px';
      var thead = buildThead();
      if (thead) { thead.className = 'sr-only'; table.appendChild(thead); }
      scrollWrap.appendChild(table);
      var mirror = buildTheadMirror();
      if (mirror) {
        scrollWrap.addEventListener('scroll', function () { mirror.scrollLeft = scrollWrap.scrollLeft; });
      }
      var wrap = document.createElement('div');
      if (mirror) wrap.appendChild(mirror);
      wrap.appendChild(scrollWrap);
      return { scrollWrap: scrollWrap, table: table, wrap: wrap };
    }

    function buildItemsTable(rowItems, orderItems, emptyMsg) {
      var shell = buildTableShell();
      var tbody = document.createElement('tbody');
      if (!rowItems.length) {
        var emptyRow = document.createElement('tr');
        var emptyTd = document.createElement('td');
        emptyTd.colSpan = colCount; emptyTd.className = 'items-empty';
        emptyTd.textContent = emptyMsg;
        emptyRow.appendChild(emptyTd);
        tbody.appendChild(emptyRow);
      } else {
        rowItems.forEach(function (item) { tbody.appendChild(buildItemRow(item, orderItems)); });
      }
      shell.table.appendChild(tbody);
      return shell.wrap;
    }

    function buildItemRow(item, orderItems) {
      var idx = orderItems.indexOf(item);

        var letter = naam ? naam.charAt(0).toUpperCase() : '#';
        if (!/[A-Z]/.test(letter)) letter = '#';
        if (seen[letter]) return;
        seen[letter] = reeks.id;
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'az-btn'; btn.textContent = letter;
        btn.setAttribute('aria-label', 'Spring naar ' + letter);
        btn.addEventListener('click', function () {
          var target = detailCardEl.querySelector('tr[data-reeks-id="' + reeks.id + '"]');
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        bar.appendChild(btn);
      });
      return bar;
    }

    function renderNestedItems(filtered, fullItemsAll) {
      var reeksSortActive = currentSortKey(entry) === 'reeks';
      var reeksen = reeksenFor(entry.id);
      if (reeksSortActive) {
        reeksen = reeksen.slice().sort(function (a, b) { return sortNaam(a.naam).localeCompare(sortNaam(b.naam), 'nl', { sensitivity: 'base' }); });
      }

      if (!reeksen.length) {
        var noReeksP = document.createElement('p'); noReeksP.className = 'items-empty';
        // Tekst hangt af van het actieve tabblad — het toevoegformulier staat alleen boven de tabel
        // als je al op "Toevoegen" staat; in "Bekijken" bestaat er geen "knop hieronder" en was de
        // oude, vaste tekst dus misleidend.
        noReeksP.textContent = viewMode === 'toevoegen'
          ? 'Nog niets toegevoegd. Gebruik het formulier hierboven om te beginnen.'
          : 'Nog niets toegevoegd. Ga naar het tabblad "Toevoegen" hierboven om te beginnen.';
        dbody.appendChild(noReeksP);
        return;
      }

      var hasActiveQuery = !!(state.search[entry.id] || '').trim() || hasActiveFilter(entry);
      // Sprongbalk om bij een lange, alfabetische reekseklijst (bv. 90+ artiesten bij Muziek) direct
      // naar een letter te springen i.p.v. te moeten scrollen — alleen zinvol als er ook echt
      // alfabetisch gesorteerd wordt en er genoeg reeksen zijn om het probleem te hébben. Verborgen
      // tijdens een actieve zoekopdracht/filter: de lijst is dan al kort, en de beschikbare letters
      // zouden niet meer kloppen met wat er nog zichtbaar is.
      if (reeksSortActive && !hasActiveQuery && reeksen.length > 8) {
        dbody.appendChild(buildAzBar(reeksen));
      }
      var shell = buildTableShell();
      var tbody = document.createElement('tbody');

      reeksen.forEach(function (reeks, ridx) {
        var groupItems = filtered.filter(function (i) { return i.reeks_id === reeks.id; });
        if (hasActiveQuery && !groupItems.length) return;
        var groupFull = fullItemsAll.filter(function (i) { return i.reeks_id === reeks.id; });
        var collapsed = !!state.collapsedReeks[reeks.id] && !hasActiveQuery;

        tbody.appendChild(buildReeksHeaderRow(reeks, ridx, reeksen, groupFull, collapsed));

        if (state.importFlow && state.importFlow.listId === entry.id && state.importFlow.reeksId === reeks.id) {
          openImportReeks = reeks;
          var impRow = document.createElement('tr'); impRow.className = 'reeks-row';
          var impTd = document.createElement('td'); impTd.colSpan = colCount;
          impTd.appendChild(buildImportPanel(entry));
          impRow.appendChild(impTd);
          tbody.appendChild(impRow);
        }

        if (!collapsed) {
          if (!groupItems.length) {
            var gEmptyRow = document.createElement('tr');
            var gEmptyTd = document.createElement('td');
            gEmptyTd.colSpan = colCount; gEmptyTd.className = 'items-empty';
            gEmptyTd.textContent = groupFull.length ? 'Geen items met dit filter.' : 'Nog geen items in deze reeks.';
            gEmptyRow.appendChild(gEmptyTd); tbody.appendChild(gEmptyRow);
          } else {
            groupItems.forEach(function (item) { tbody.appendChild(buildItemRow(item, groupFull)); });
          }
        }
      });

      var orphanItems = filtered.filter(function (i) { return !i.reeks_id; });
      if (orphanItems.length) {
        var orphanFull = fullItemsAll.filter(function (i) { return !i.reeks_id; });
        var oHeadRow = document.createElement('tr'); oHeadRow.className = 'reeks-row';
        var oHeadTd = document.createElement('td'); oHeadTd.colSpan = colCount;
        var oLabel = document.createElement('span'); oLabel.className = 'reeks-label-plain'; oLabel.textContent = 'Zonder reeks';
        oHeadTd.appendChild(oLabel); oHeadRow.appendChild(oHeadTd); tbody.appendChild(oHeadRow);
        orphanItems.forEach(function (item) { tbody.appendChild(buildItemRow(item, orphanFull)); });
      }

      shell.table.appendChild(tbody);
      dbody.appendChild(shell.wrap);
    }

    if (entry.genest) {
      if (viewMode === 'toevoegen') {
        var addRow = document.createElement('div'); addRow.className = 'genest-add-row';
        addRow.appendChild(buildGenestAddForm(entry));
        if (entry.auto_import === 'openlibrary') addRow.appendChild(buildIsbnAddForm(entry));
        dbody.appendChild(addRow);
      }
      renderNestedItems(items, fullItems);
    } else {
      if (viewMode === 'toevoegen') dbody.appendChild(buildAddItemForm(entry));
      var emptyMsg = fullItems.length ? 'Geen items met dit filter.' : (viewMode === 'toevoegen'
        ? 'Nog geen items op dit lijstje. Gebruik het formulier hierboven.'
        : 'Nog geen items op dit lijstje. Ga naar het tabblad "Toevoegen" hierboven om te beginnen.');
      dbody.appendChild(buildItemsTable(items, fullItems, emptyMsg));
    }


    detailCardEl.appendChild(dbody);
    applyWideRowContentWidths();
    applyStickyTheadOffset();

    if (restoreSearchFocus !== null) {
      var searchInputEl = detailCardEl.querySelector('.search-input');
      if (searchInputEl) { searchInputEl.focus(); searchInputEl.setSelectionRange(restoreSearchFocus, restoreSearchFocus); }
    }
  }

  // `calc(100vw - Npx)` in de `.wide-row-content`-CSS is een redelijke schatting, maar iOS Safari
  // berekent `100vw` niet altijd gelijk aan de echte zichtbare breedte (bekende platform-quirk) —
  // vandaar dit na elke render overschrijven met een gemeten waarde (de scroll-container kent zijn
  // eigen breedte altijd correct, ongeacht dat soort viewport-verschillen).
  function applyWideRowContentWidths() {
    var scrollWrap = detailCardEl.querySelector('.items-scroll');
    if (!scrollWrap || !scrollWrap.clientWidth) return;
    var w = scrollWrap.clientWidth + 'px';
    detailCardEl.querySelectorAll('.wide-row-content').forEach(function (el) { el.style.maxWidth = w; });
  }
  // De vinkjes-mirror-koprij (`.thead-mirror`) is sticky op `top: env(safe-area-inset-top)` (zelfde
  // CSS-regel als de A-Z-sprongbalk hierboven) — bij een genest lijstje MET zichtbare sprongbalk
  // staan ze anders over elkaar heen zodra beide "vastplakken". De sprongbalk is zelf ook sticky,
  // dus zijn eigen (gerenderde) hoogte is precies de extra ruimte die de mirror erbij nodig heeft —
  // gemeten in JS i.p.v. geschat, zelfde reden als bij applyWideRowContentWidths() hierboven. Ook de
  // spacer-breedte (staat voor de sticky titelkolom, die een vloeiende breedte heeft tussen 160 en
  // 268px) wordt hier op de daadwerkelijk gerenderde titelkolom-breedte gezet, en de mirror krijgt
  // meteen de huidige scrollpositie van de tabel mee (anders staat hij bij openen op scrollLeft 0
  // terwijl de tabel zelf toevallig al gescrold was).
  function applyStickyTheadOffset() {
    var azBar = detailCardEl.querySelector('.az-bar');
    var mirror = detailCardEl.querySelector('.thead-mirror');
    if (!mirror) return;
    var extra = azBar ? azBar.getBoundingClientRect().height : 0;
    mirror.style.top = extra ? 'calc(env(safe-area-inset-top) + ' + extra + 'px)' : '';
    var scrollWrap = detailCardEl.querySelector('.items-scroll');
    var titleCell = scrollWrap && scrollWrap.querySelector('td.col-title');
    var spacer = mirror.querySelector('.thead-mirror-spacer');
    if (spacer && titleCell) spacer.style.width = titleCell.getBoundingClientRect().width + 'px';
    if (scrollWrap) mirror.scrollLeft = scrollWrap.scrollLeft;
  }
  // `position:sticky` op een element BINNEN een `<td>` (i.p.v. op de `<td>` zelf) staat bekend om
  // wisselend gedrag op WebKit/iOS — als die sticky-positionering daar niet aanslaat, blijft een
  // colSpan-rij (bewerkform, cover-/tracklist-zoekpaneel) toch op zijn "natuurlijke" plek in de
  // brede tabel staan i.p.v. mee te schuiven naar de zichtbare linkerrand. Reset daarom de
  // scrollpositie van de tabel expliciet bij het OPENEN van zo'n rij (niet bij elke render) —
  // zo hangt zichtbaarheid niet af van of sticky het daar wel/niet doet.
  function resetItemsScroll() {
    var scrollWrap = detailCardEl.querySelector('.items-scroll');
    if (scrollWrap) scrollWrap.scrollLeft = 0;
  }

  // ---------- Modus-tabs: Zoeken / Bekijken / Toevoegen ----------
  // Bewust gescheiden i.p.v. altijd alles tegelijk tonen: zoeken, filteren/sorteren en toevoegen
  // zijn losse activiteiten die elkaar in de weg zitten als ze allemaal tegelijk in beeld staan
  // (concrete klacht: "als ik zoek ben ik niet aan het toevoegen"). Wisselen kan altijd via de tabs.
  function setViewMode(entry, mode) {
    var prev = state.viewMode[entry.id] || 'bekijken';
    if (prev === mode) return;
    if (prev === 'toevoegen') {
      delete state.isbnLookup[entry.id];
      if (state.importFlow && state.importFlow.listId === entry.id) state.importFlow = null;
      if (state.compareFlow && state.compareFlow.listId === entry.id) state.compareFlow = null;
    }
    state.viewMode[entry.id] = mode;
    renderDetail();
  }

  function renderModeTabs(entry) {
    var wrap = document.createElement('div'); wrap.className = 'mode-tabs';
    var current = state.viewMode[entry.id] || 'bekijken';
    [['bekijken', 'Bekijken'], ['toevoegen', 'Toevoegen']].forEach(function (pair) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'mode-tab-btn' + (current === pair[0] ? ' active' : '');
      btn.textContent = pair[1];
      btn.addEventListener('click', function () { setViewMode(entry, pair[0]); });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  // ---------- Filter row ----------
  // Eén tikbare chip per vinkje i.p.v. een drieknops Alles/Wel/Niet-segment — tikken doorloopt
  // alle → wel → niet → alle. Compacter (past meer filters op één regel) en de kleur van de chip
  // zelf toont de status, i.p.v. een klein "actief"-knopje binnen een groepje knoppen.
  var FILTER_CYCLE = ['alle', 'wel', 'niet'];
  function renderFilterRow(entry) {
    var row = document.createElement('div');
    row.className = 'filter-row';
    entry.vink_velden.forEach(function (vk) {
      var current = (state.filters[entry.id] && state.filters[entry.id][vk.key]) || 'alle';
      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'filter-chip filter-chip-' + current;
      var mark = current === 'wel' ? '✓ ' : current === 'niet' ? '✕ ' : '';
      chip.textContent = mark + vk.label;
      chip.setAttribute('aria-label', vk.label + ': ' + (current === 'wel' ? 'wel' : current === 'niet' ? 'niet' : 'alles'));
      chip.addEventListener('click', function () {
        var next = FILTER_CYCLE[(FILTER_CYCLE.indexOf(current) + 1) % FILTER_CYCLE.length];
        if (!state.filters[entry.id]) state.filters[entry.id] = {};
        state.filters[entry.id][vk.key] = next;
        renderDetail();
      });
      row.appendChild(chip);
    });
    return row;
  }

  // ---------- Fields editor ----------
  function renderFieldsEditor(entry) {
    var box = document.createElement('div');
    box.className = 'fields-editor';

    function persist(patch) { supabase.from('lijsten').update(patch).eq('id', entry.id).then(refetchSoft); }

    var descGroup = document.createElement('div');
    descGroup.className = 'fields-editor-group';
    var descH4 = document.createElement('h4'); descH4.textContent = 'Omschrijving';
    descGroup.appendChild(descH4);
    var descArea = document.createElement('textarea');
    descArea.className = 'fields-editor-desc'; descArea.rows = 2;
    descArea.placeholder = 'Voeg een omschrijving toe…';
    descArea.value = entry.omschrijving || '';
    descArea.addEventListener('blur', function () {
      var v = descArea.value.trim();
      if (v !== (entry.omschrijving || '')) persist({ omschrijving: v || null });
    });
    descGroup.appendChild(descArea);
    box.appendChild(descGroup);

    function buildGroup(title, arr, cap, kindLabel, onAdd) {
      var group = document.createElement('div');
      group.className = 'fields-editor-group';
      var h4 = document.createElement('h4'); h4.textContent = title;
      group.appendChild(h4);
      arr.forEach(function (f, i) {
        var row = document.createElement('div'); row.className = 'fields-editor-row';
        var inp = document.createElement('input'); inp.value = f.label;
        inp.addEventListener('blur', function () {
          var v = inp.value.trim();
          if (!v || v === f.label) { inp.value = f.label; return; }
          var copy = arr.slice(); copy[i] = { key: f.key, label: v };
          persist(kindLabel === 'extra' ? { extra_velden: copy } : { vink_velden: copy });
        });
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'icon-btn danger'; del.innerHTML = '&#10005;';
        del.setAttribute('aria-label', 'Verwijder veld ' + f.label);
        del.addEventListener('click', function () {
          var copy = arr.slice(); copy.splice(i, 1);
          persist(kindLabel === 'extra' ? { extra_velden: copy } : { vink_velden: copy });
        });
        row.appendChild(inp); row.appendChild(del);
        group.appendChild(row);
      });
      var addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'link-btn';
      addBtn.textContent = kindLabel === 'extra' ? '+ tekstveld toevoegen' : '+ vinkje toevoegen';
      addBtn.disabled = arr.length >= cap;
      addBtn.addEventListener('click', onAdd);
      group.appendChild(addBtn);
      return group;
    }

    if (entry.auto_import === 'discogs') {
      var sourceGroup = document.createElement('div'); sourceGroup.className = 'fields-editor-group';
      var sh4 = document.createElement('h4'); sh4.textContent = 'Discogs';
      sourceGroup.appendChild(sh4);
      var userRow = document.createElement('div'); userRow.className = 'field-row';
      var userLabel = document.createElement('label'); userLabel.textContent = 'Discogs-gebruikersnaam';
      var userInput = document.createElement('input');
      userInput.value = entry.discogs_username || ''; userInput.placeholder = 'Bijv. bertellen';
      userInput.addEventListener('blur', function () {
        var v = userInput.value.trim();
        if (v === (entry.discogs_username || '')) return;
        persist({ discogs_username: v || null });
      });
      userRow.appendChild(userLabel); userRow.appendChild(userInput);
      sourceGroup.appendChild(userRow);
      box.appendChild(sourceGroup);
    }

    if (entry.auto_import === 'bgg') {
      var bggGroup = document.createElement('div'); bggGroup.className = 'fields-editor-group';
      var bh4 = document.createElement('h4'); bh4.textContent = 'BoardGameGeek';
      bggGroup.appendChild(bh4);
      var bggRow = document.createElement('div'); bggRow.className = 'field-row';
      var bggLabel = document.createElement('label'); bggLabel.textContent = 'BGG-gebruikersnaam';
      var bggInput = document.createElement('input');
      bggInput.value = entry.bgg_username || ''; bggInput.placeholder = 'Bijv. bertuf';
      bggInput.addEventListener('blur', function () {
        var v = bggInput.value.trim();
        if (v === (entry.bgg_username || '')) return;
        persist({ bgg_username: v || null });
      });
      bggRow.appendChild(bggLabel); bggRow.appendChild(bggInput);
      bggGroup.appendChild(bggRow);
      box.appendChild(bggGroup);
    }

    box.appendChild(buildGroup('Tekstvelden', entry.extra_velden || [], FIELD_CAP.extra, 'extra', function () {
      var arr = entry.extra_velden || [];
      var key = uniqueKey(slugify('Nieuw veld'), arr.map(function (f) { return f.key; }));
      persist({ extra_velden: arr.concat([{ key: key, label: 'Nieuw veld' }]) });
    }));
    box.appendChild(buildGroup('Vinkjes', entry.vink_velden || [], FIELD_CAP.vink, 'vink', function () {
      var arr = entry.vink_velden || [];
      var key = uniqueKey(slugify('Nieuw vinkje'), arr.map(function (f) { return f.key; }));
      persist({ vink_velden: arr.concat([{ key: key, label: 'Nieuw vinkje' }]) });
    }));
    return box;
  }

    var confirm = document.createElement('button');
    confirm.type = 'button'; confirm.className = 'btn-primary'; confirm.textContent = 'Aanmaken';
    function submit() {
      var v = nameInput.value.trim();
      if (!v) { nameInput.focus(); return; }
      var preset = PRESETS[selectedTpl];
      var typeLabel = selectedTpl === 'aangepast' ? (customTypeInput.value.trim() || 'Aangepast') : preset.type_label;
      supabase.from('lijsten').insert({
        naam: v, omschrijving: descInput.value.trim() || null, type_label: typeLabel,
        auto_import: preset.auto_import, extra_velden: preset.extra_velden, vink_velden: preset.vink_velden, doorstrepen: preset.doorstrepen,
        genest: preset.genest || false, volgorde: Date.now()
      }).then(refetchSoft);

    confirm.addEventListener('click', submit);
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } if (e.key === 'Escape') card.remove(); });
    actions.appendChild(cancel); actions.appendChild(confirm);

  function deleteList(id, name) {
    if (!window.confirm('Lijstje "' + name + '" verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
    if (state.currentId === id) goHome();
    supabase.from('lijsten').delete().eq('id', id).then(refetchSoft);
  }

  function moveList(id, dir) {
    var lists = sortedLists();
    var idx = lists.findIndex(function (l) { return l.id === id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= lists.length) return;
    var a = lists[idx], b = lists[swapIdx];
    Promise.all([
      supabase.from('lijsten').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijsten').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  function moveItem(items, item, dir) {
    var idx = items.findIndex(function (i) { return i.id === item.id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= items.length) return;
    var a = items[idx], b = items[swapIdx];
    Promise.all([
      supabase.from('lijst_items').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijst_items').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  async function uploadCover(listId, file, triggerBtn) {
    var originalText = triggerBtn && triggerBtn.textContent;
    if (triggerBtn) { triggerBtn.textContent = 'Bezig…'; triggerBtn.disabled = true; }
    try {
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      var path = COVER_PREFIX + listId + '-' + Date.now() + '.' + ext;
      var upload = await supabase.storage.from(COVER_BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
      if (upload.error) throw upload.error;
      var pub = supabase.storage.from(COVER_BUCKET).getPublicUrl(path);
      await supabase.from('lijsten').update({ omslag_url: pub.data.publicUrl }).eq('id', listId);
      await refetchAll();
    } catch (e) {
      console.error('cover upload failed', e);
      window.alert('Uploaden van de foto is niet gelukt.');
    } finally {
      if (triggerBtn) { triggerBtn.textContent = originalText; triggerBtn.disabled = false; }
    }
  }
  function removeCover(listId) {
    if (!window.confirm('Foto verwijderen?')) return;
    supabase.from('lijsten').update({ omslag_url: null }).eq('id', listId).then(refetchSoft);
  }

  async function uploadItemCover(item, file) {

  // ---------- Cover ophalen (Open Library) voor handmatig toegevoegde boeken ----------
