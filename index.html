<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lijster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<meta name="apple-mobile-web-app-title" content="Lijster">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #EFF1EA;
    --surface: #FBFBF7;
    --surface-2: #E4E7DD;
    --ink: #232620;
    --muted: #6E7266;
    --accent: #2F6F5E;
    --accent-ink: #F4F8F5;
    --accent-soft: #DCEAE3;
    --danger: #B5482F;
    --danger-soft: #F3E1DA;
    --border: #D8DBCF;
    --shadow: rgba(35,38,32,0.10);
    --focus: #2F6F5E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
      --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
      --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
    --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
    --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 90px; padding-top: calc(32px + env(safe-area-inset-top)); }
  @media (min-width: 640px) { .wrap { padding: 40px 28px 90px; padding-top: calc(40px + env(safe-area-inset-top)); } }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  h1.brand { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  p.tagline { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; font-style: italic; font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 11px 18px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 2px var(--shadow); transition: transform 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px var(--shadow); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-secondary {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 14px; font-size: 0.85rem; font-weight: 500;
  }
  .btn-secondary:hover { background: var(--accent-soft); }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 0.86rem; padding: 6px 4px; }
  .btn-text:hover { color: var(--ink); }
  .btn-text.danger { color: var(--danger); }
  .btn-text.danger:hover { text-decoration: underline; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 0.82rem; padding: 4px 2px; align-self: flex-start; font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  main { position: relative; }
  [hidden] { display: none !important; }

  /* ---- Overview grid ---- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 1px 2px var(--shadow); cursor: pointer; display: flex; flex-direction: column;
    position: relative; transition: transform 0.15s ease, box-shadow 0.15s ease; text-align: left; color: inherit; overflow: hidden;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 18px var(--shadow); }
  .card-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface-2); }
  .card-cover-placeholder {
    width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 2.4rem; color: var(--muted);
  }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.1rem; margin: 0; line-height: 1.25; text-wrap: balance; }
  .pill { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .count-tag { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card-desc { margin: 0; font-size: 0.84rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .preview { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .preview li { display: flex; align-items: baseline; gap: 6px; font-size: 0.85rem; color: var(--ink); }
  .preview li.done { color: var(--muted); }
  .preview .p-primary.done { text-decoration: line-through; }
  .preview .p-secondary { color: var(--muted); font-size: 0.8rem; }
  .preview .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); flex-shrink: 0; }
  .preview .dot.filled { background: var(--accent); border-color: var(--accent); }
  .preview .more { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; }
  .card-empty { color: var(--muted); font-size: 0.84rem; font-style: italic; margin: 0; }

  .card-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .icon-btn {
    width: 27px; height: 27px; border-radius: 7px; border: none; background: rgba(251,251,247,0.9); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; box-shadow: 0 1px 3px var(--shadow); flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

  .ghost-card { border: 1.5px dashed var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); grid-column: 1 / -1; }
  .ghost-card h3 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; }
  .template-choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .template-btn {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 9px;
    padding: 9px 14px; font-size: 0.86rem; font-weight: 500; display: flex; flex-direction: column; gap: 2px; text-align: left;
  }
  .template-btn small { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
  .template-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row label { font-size: 0.76rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row input, .field-row textarea {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 9px 11px;
    font-family: inherit; font-size: 0.94rem; color: var(--ink); resize: vertical;
  }
  .field-row input:focus, .field-row textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .ghost-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state p.big { font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem; color: var(--ink); margin: 0 0 6px; }

  /* ---- Detail view ---- */
  #detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px var(--shadow); }
  .back-row { padding: 14px 20px 0; }
  .back-btn { background: none; border: none; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; padding: 6px 4px; }
  .back-btn:hover { color: var(--ink); }

  .cover-area { position: relative; width: 100%; }
  .cover-img { width: 100%; max-height: 260px; object-fit: cover; display: block; background: var(--surface-2); }
  .cover-placeholder { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; background: var(--surface-2);
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 3rem; color: var(--muted); }
  .cover-actions { position: absolute; bottom: 10px; right: 12px; display: flex; gap: 8px; }
  .cover-slim-row { padding: 8px 24px 0; }
  .cover-actions .btn-secondary { background: rgba(251,251,247,0.92); }

  .detail-body { padding: 18px 24px 26px; }
  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 4px; flex-wrap: wrap; }
  .detail-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.55rem; margin: 0; padding: 4px 2px; border: none;
    background: transparent; color: var(--ink); flex: 1 1 auto; min-width: 160px; }
  .detail-title:focus { outline: none; border-bottom: 1.5px solid var(--accent); }
  .detail-meta { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; flex-wrap: wrap; }
  .detail-desc { width: 100%; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 0.92rem;
    padding: 2px; resize: none; line-height: 1.5; margin-bottom: 6px; }
  .detail-desc:focus { outline: none; background: var(--surface-2); border-radius: 8px; }
  .detail-desc::placeholder { color: var(--muted); opacity: 0.7; }
  hr.div { border: none; border-top: 1px solid var(--border); margin: 4px 0 14px; }

  .fields-toggle-row { margin-bottom: 4px; }

  .fields-editor { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 16px; }
  .fields-editor h4 { margin: 0 0 8px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  .fields-editor-group { display: flex; flex-direction: column; gap: 6px; }
  .fields-editor-row { display: flex; align-items: center; gap: 8px; }
  .fields-editor-row input { flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; font-family: inherit; font-size: 0.88rem; color: var(--ink); }

  .search-sort-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 14px; }
  .search-input {
    flex: 1; min-width: 140px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 8px 12px; font-family: inherit; font-size: 0.9rem; color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .search-input::-webkit-search-cancel-button { cursor: pointer; }
  .sort-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .sort-select {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 9px;
    font-family: inherit; font-size: 0.85rem; color: var(--ink);
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 14px 20px; margin: 0 0 16px; }
  .filter-group { display: flex; align-items: center; gap: 7px; }
  .filter-group .fg-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .filter-seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .filter-seg button { background: var(--surface); border: none; padding: 5px 10px; font-size: 0.76rem; color: var(--muted); }
  .filter-seg button + button { border-left: 1px solid var(--border); }
  .filter-seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .import-toggle-row { margin-bottom: 14px; }
  .import-panel { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .import-search { display: flex; gap: 8px; }
  .import-search input { flex: 1; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 11px; font-family: inherit; font-size: 0.9rem; color: var(--ink); }
  .import-candidates { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .import-candidate { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 11px; font-size: 0.86rem; }
  .import-candidate:hover { background: var(--accent-soft); }
  .import-candidate small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .import-works { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .import-work-row { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; padding: 3px 0; }
  .import-work-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .import-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .import-msg { font-size: 0.84rem; color: var(--muted); font-style: italic; }
  .import-msg.error { color: var(--danger); font-style: normal; }

  .items-scroll { overflow-x: auto; margin: 0 0 18px; -webkit-overflow-scrolling: touch; }
  .items-table { border-collapse: collapse; width: 100%; }
  .items-table thead th {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); font-weight: 600;
    text-align: center; padding: 0 4px 8px; border-bottom: 1px solid var(--border); white-space: normal; line-height: 1.15;
  }
  .items-table tbody tr { border-bottom: 1px solid var(--border); }
  .items-table tbody tr:last-child { border-bottom: none; }
  .items-table td { padding: 8px 4px; vertical-align: middle; }
  .col-title { position: sticky; left: 0; background: var(--surface); z-index: 2; text-align: left; min-width: 160px; max-width: 280px; padding-left: 2px !important; }
  .edit-row-cell { text-align: left; }
  .col-title-head { z-index: 3; }
  .col-actions { position: sticky; right: 0; background: var(--surface); z-index: 2; white-space: nowrap; width: 1%; }
  .col-actions-head { z-index: 3; }
  .col-check { text-align: center; width: 54px; min-width: 54px; }
  .title-cell-inner { display: flex; align-items: center; gap: 8px; }
  .move-col { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
  .item-thumb { width: 30px; height: 42px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: var(--surface-2); }
  .move-btn { width: 20px; height: 16px; border: none; background: none; color: var(--border); display: flex; align-items: center; justify-content: center; padding: 0; line-height: 0; }
  .move-btn:not(:disabled):hover { color: var(--accent); }
  .move-btn:disabled { visibility: hidden; }
  .checkbox {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0; margin: 0 auto; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox svg { width: 13px; height: 13px; stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20;
    transition: stroke-dashoffset 0.2s ease; stroke-linecap: round; stroke-linejoin: round; }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked svg { stroke-dashoffset: 0; }
  @media (prefers-reduced-motion: reduce) { .checkbox svg, .card, .card-controls, .icon-btn { transition: none; } }
  .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; cursor: pointer; padding: 2px 0; }
  .item-primary { font-size: 0.98rem; overflow-wrap: anywhere; }
  .item-secondary { font-size: 0.83rem; color: var(--muted); overflow-wrap: anywhere; }
  .item-row.done .item-primary { color: var(--muted); text-decoration: line-through; }
  .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .items-empty { color: var(--muted); font-style: italic; padding: 14px 2px; font-size: 0.9rem; text-align: left; }

  .edit-form { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .edit-form input { border: 1px solid var(--accent); background: var(--surface); border-radius: 7px; padding: 6px 9px; font-family: inherit; font-size: 0.92rem; color: var(--ink); flex: 1; min-width: 100px; }
  .edit-form-actions { display: flex; gap: 4px; }

  form.add-item { display: flex; gap: 10px; align-items: center; border-top: 1.5px dashed var(--border); padding-top: 16px; flex-wrap: wrap; }
  form.add-item .add-fields { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  form.add-item input {
    flex: 1; min-width: 120px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 10px 13px; font-family: inherit; font-size: 0.94rem; color: var(--ink);
  }
  form.add-item input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  form.add-item button.submit-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 9px; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem;
  }

  .detail-footer { display: flex; justify-content: flex-end; margin-top: 4px; }
  .app-version { text-align: center; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; margin-top: 28px; opacity: 0.7; }
  .status-note { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.94rem; }
  .install-hint { margin: 0 0 22px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--accent-soft);
    color: var(--ink); font-size: 0.84rem; display: flex; align-items: center; gap: 10px; }
  .install-hint button { margin-left: auto; flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="app-header">
    <div>
      <h1 class="brand">Lijster</h1>
      <p class="tagline">al je lijstjes, netjes bij elkaar</p>
    </div>
    <button class="btn-primary" id="new-list-btn" type="button"><span aria-hidden="true">+</span> Nieuw lijstje</button>
  </header>

  <div id="install-hint" class="install-hint" hidden>
    <span>Zet dit op je beginscherm: deel-icoon &rarr; "Zet op beginscherm".</span>
    <button type="button" class="btn-text" id="dismiss-install-hint">Sluiten</button>
  </div>

  <main>
    <div id="grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <p class="big">Nog geen lijstjes</p>
      <p>Maak je eerste lijstje aan met de knop hierboven.</p>
    </div>
    <div id="detail" hidden><div id="detail-card"></div></div>
    <div id="status-note" class="status-note" hidden></div>
  </main>
  <p class="app-version" id="app-version"></p>
</div>

        return want === 'wel' ? val : !val;

        });
        var del = document.createElement('button');

  function moveList(id, dir) {
    var lists = sortedLists();
    var idx = lists.findIndex(function (l) { return l.id === id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= lists.length) return;
    var a = lists[idx], b = lists[swapIdx];
    Promise.all([
      supabase.from('lijsten').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijsten').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  function moveItem(items, item, dir) {
    var idx = items.findIndex(function (i) { return i.id === item.id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= items.length) return;
    var a = items[idx], b = items[swapIdx];
    Promise.all([
      supabase.from('lijst_items').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijst_items').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);

  async function uploadCover(listId, file, triggerBtn) {
    var originalText = triggerBtn.textContent;
    triggerBtn.textContent = 'Bezig…'; triggerBtn.disabled = true;
    try {
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      var path = COVER_PREFIX + listId + '-' + Date.now() + '.' + ext;
      var upload = await supabase.storage.from(COVER_BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
      if (upload.error) throw upload.error;
      var pub = supabase.storage.from(COVER_BUCKET).getPublicUrl(path);
      await supabase.from('lijsten').update({ omslag_url: pub.data.publicUrl }).eq('id', listId);
      await refetchAll();
    } catch (e) {
      console.error('cover upload failed', e);
      window.alert('Uploaden van de foto is niet gelukt.');
    } finally {
      triggerBtn.textContent = originalText; triggerBtn.disabled = false;
    }
  }
  function removeCover(listId) {

    supabase.from('lijsten').update({ omslag_url: null }).eq('id', listId).then(refetchSoft);
  }

  // ---------- Auto-import (Open Library / MusicBrainz) ----------
  function openImportFlow(entry) {
    state.importFlow = {
      listId: entry.id, source: entry.auto_import, step: 'search', query: '',
      candidates: [], candidateName: '', candidateId: '', works: [], selected: new Set(),
      loading: false, error: ''
    };
    renderDetail();
  }
  function closeImportFlow() { state.importFlow = null; renderDetail(); }

  async function importSearch(query) {
    var flow = state.importFlow;
    flow.query = query; flow.loading = true; flow.error = ''; renderDetail();
    try {
      if (flow.source === 'openlibrary') {
        var res = await fetch('https://openlibrary.org/search/authors.json?q=' + encodeURIComponent(query));
        var data = await res.json();
        flow.candidates = (data.docs || []).slice(0, 8).map(function (d) {
          return { id: d.key, name: d.name, meta: [d.birth_date, d.work_count ? (d.work_count + ' werken') : null].filter(Boolean).join(' · ') };
        });
      } else {
        var res2 = await fetch('https://musicbrainz.org/ws/2/artist/?query=' + encodeURIComponent(query) + '&fmt=json&limit=8');
        var data2 = await res2.json();
        if (data2.error) throw new Error(data2.error);
        flow.candidates = (data2.artists || []).map(function (a) {
          return { id: a.id, name: a.name, meta: [a.disambiguation, a['life-span'] && a['life-span'].begin].filter(Boolean).join(' · ') };
        });
      }
      flow.step = 'candidates';
      if (!flow.candidates.length) flow.error = 'Geen resultaten voor "' + query + '".';
    } catch (e) {
      console.error('import search failed', e);
      flow.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  async function importPickCandidate(cand) {
    var flow = state.importFlow;
    flow.candidateName = cand.name; flow.candidateId = cand.id;
    flow.loading = true; flow.error = ''; renderDetail();
    try {
      var works = [];
      if (flow.source === 'openlibrary') {
        var res = await fetch('https://openlibrary.org/search.json?author_key=' + encodeURIComponent(cand.id) + '&language=dut&limit=300&fields=key,title,cover_i');
        var data = await res.json();
        var seen = {};
        (data.docs || []).forEach(function (w) {
          var norm = (w.title || '').trim().toLowerCase();
          if (!norm || seen[norm]) return;
          seen[norm] = true;
          works.push({ id: w.key, title: w.title, coverUrl: w.cover_i ? ('https://covers.openlibrary.org/b/id/' + w.cover_i + '-M.jpg') : null });
        });
        works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      } else {
        var res2 = await fetch('https://musicbrainz.org/ws/2/release-group?artist=' + cand.id + '&type=album&fmt=json&limit=100');
        var data2 = await res2.json();
        if (data2.error) throw new Error(data2.error);
        var seen2 = {};
        (data2['release-groups'] || []).forEach(function (rg) {
          var norm = (rg.title || '').trim().toLowerCase();
          if (!norm || seen2[norm]) return;
          seen2[norm] = true;
          works.push({ id: rg.id, title: rg.title, year: (rg['first-release-date'] || '').slice(0, 4) });
        });
        works.sort(function (a, b) { return (a.year || '9999').localeCompare(b.year || '9999') || a.title.localeCompare(b.title); });
      }
      flow.works = works;
      flow.selected = new Set(works.map(function (w) { return w.id; }));
      flow.step = 'works';
      if (!works.length) flow.error = 'Geen titels gevonden.';
    } catch (e) {
      console.error('import fetch works failed', e);
      flow.error = 'Ophalen is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  async function importCommit(entry) {
    var flow = state.importFlow;
    var existingExternIds = {};
    itemsFor(entry.id).forEach(function (i) { if (i.extern_id) existingExternIds[i.extern_id] = true; });
    var extraKey = entry.extra_velden && entry.extra_velden[0] ? entry.extra_velden[0].key : null;
    var rows = [];
    var base = Date.now();
    flow.works.forEach(function (w, i) {
      if (!flow.selected.has(w.id) || existingExternIds[w.id]) return;
      var extra = {}; if (extraKey) extra[extraKey] = flow.candidateName;
      var vinkjes = {};
      (entry.vink_velden || []).forEach(function (vk) { vinkjes[vk.key] = false; });
      rows.push({ lijst_id: entry.id, titel: w.title, extra: extra, vinkjes: vinkjes, bron: flow.source, extern_id: w.id, omslag_url: w.coverUrl || null, volgorde: base + i });
    });
    closeImportFlow();
    if (!rows.length) return;
    var result = await supabase.from('lijst_items').insert(rows);
    refetchSoft(result);
  }

      input.type = 'text'; input.placeholder = entry.auto_import === 'openlibrary' ? 'Naam van de auteur' : 'Naam van de artiest';

      searchBtn.disabled = flow.loading;

      searchBtn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      searchRow.appendChild(input); searchRow.appendChild(searchBtn);

      setTimeout(function () { input.focus(); }, 0);
    } else if (flow.step === 'candidates') {
      var list = document.createElement('div'); list.className = 'import-candidates';

        var cb = document.createElement('button');
        cb.type = 'button'; cb.className = 'import-candidate';

        cb.addEventListener('click', function () { importPickCandidate(c); });
        list.appendChild(cb);
      });
      panel.appendChild(list);
      var backToSearch = document.createElement('button');
      backToSearch.type = 'button'; backToSearch.className = 'btn-text'; backToSearch.textContent = '← Opnieuw zoeken';
      backToSearch.addEventListener('click', function () { flow.step = 'search'; flow.error = ''; renderDetail(); });
      panel.appendChild(backToSearch);
    } else if (flow.step === 'works') {
      var sub = document.createElement('p'); sub.className = 'import-msg';
      var countLabel = flow.source === 'openlibrary' ? ' Nederlandstalige titels gevonden voor ' : ' titels gevonden voor ';
      sub.textContent = flow.works.length + countLabel + flow.candidateName + '. Vink uit wat je niet wilt toevoegen.';
      panel.appendChild(sub);
      var worksList = document.createElement('div'); worksList.className = 'import-works';
      flow.works.forEach(function (w) {
        var row = document.createElement('label'); row.className = 'import-work-row';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = flow.selected.has(w.id);
        cb.addEventListener('change', function () {
          if (cb.checked) flow.selected.add(w.id); else flow.selected.delete(w.id);
          addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
        });
        var span = document.createElement('span');
        span.textContent = w.title + (w.year ? ' (' + w.year + ')' : '');
        row.appendChild(cb); row.appendChild(span);
        worksList.appendChild(row);
      });
      panel.appendChild(worksList);
      var commitRow = document.createElement('div'); commitRow.className = 'import-actions';
      var addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'btn-primary';
      addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
      addBtn.addEventListener('click', function () { importCommit(entry); });
      commitRow.appendChild(addBtn);
      panel.appendChild(commitRow);
    }

    if (flow.error) {
      var errP = document.createElement('p'); errP.className = 'import-msg error'; errP.textContent = flow.error;
      panel.appendChild(errP);
    }

    wrap.appendChild(panel);
    return wrap;
  }

  // ---------- Data ----------
  async function refetchAll() {
    var res = await Promise.all([
      supabase.from('lijsten').select('*').order('volgorde', { ascending: true }),
      supabase.from('lijst_items').select('*').order('volgorde', { ascending: true })
    ]);
    var lijstenRes = res[0], itemsRes = res[1];
    if (lijstenRes.error || itemsRes.error) {
      console.error(lijstenRes.error || itemsRes.error);
      showStatus('Kon lijstjes niet laden. Controleer je verbinding.');
      return;
    }
    showStatus('');
    state.lijsten = lijstenRes.data || [];
    state.items = itemsRes.data || [];
    renderOverview();
    if (state.currentId) renderDetail();
  }
  function refetchSoft(result) {
    if (result && result.error) { console.error(result.error); window.alert('Er ging iets mis bij het opslaan.'); }
    return refetchAll();
  }

  function subscribeRealtime() {
    supabase.channel('lijstjeslijst_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijsten' }, refetchAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijst_items' }, refetchAll)
      .subscribe();
  }

  function maybeShowInstallHint() {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    var dismissed = false;
    try { dismissed = localStorage.getItem('lijstjeslijst-install-hint-dismissed') === '1'; } catch (e) {}
    if (isIOS && !isStandalone && !dismissed) installHint.hidden = false;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function (e) { console.error('SW registratie mislukt', e); });
    });
  }

  document.getElementById('app-version').textContent = 'v' + APP_VERSION;
  maybeShowInstallHint();
  showStatus('Lijstjes laden…');
  refetchAll();
  subscribeRealtime();
})();
</script>
</body>
</html>
