  newListBtn.addEventListener('click', showNewListForm);

  // ---------- Auto-import (Open Library / Discogs) ----------
  function openImportFlow(entry, reeks, sourceOverride) {
    var source = sourceOverride || entry.auto_import;
    state.importFlow = {
      listId: entry.id, reeksId: reeks ? reeks.id : null, source: source, step: 'search', query: reeks ? reeks.naam : '',
      candidates: [], candidateName: '', candidateId: '', works: [], selected: new Set(),
      loading: false, error: '', note: ''
    };
    if (source === 'discogs' || source === 'bgg') {
      state.importFlow.step = 'works';
      state.importFlow.loading = true;
      if (source === 'discogs') runDiscogsFetch(entry); else runBggFetch(entry);
      renderDetail();
    } else if (reeks) {
      importSearch(reeks.naam);
    } else {
      renderDetail();
    }
    // Zelfde iOS-scroll-reset als bij het openen van een bewerkformulier/cover-/tracklist-zoeken —
    // dit paneel is ook een wide-row-content-rij en hoort dezelfde bescherming te krijgen (was
    // eerder gemist; ontdekt bij het toevoegen van de wide-row-content-klasse aan buildImportPanel).
    resetItemsScroll();
  }
  function closeImportFlow() { state.importFlow = null; renderDetail(); }

  async function fetchDiscogsCollection(username) {
    var page = 1, perPage = 100, all = [];
    while (true) {
      var res = await fetch('https://api.discogs.com/users/' + encodeURIComponent(username) + '/collection/folders/0/releases?per_page=' + perPage + '&page=' + page);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      all = all.concat(data.releases || []);
      var pages = (data.pagination && data.pagination.pages) || 1;
      if (page >= pages || !data.releases || !data.releases.length) break;
      page++;
    }
    return all;
  }
  // Persoonlijk token (zie DISCOGS_TOKEN hierboven) i.p.v. anoniem — nodig omdat dit een schrijvende
  // aanroep is (i.t.t. alle andere Discogs-aanroepen in dit bestand, die publieke, alleen-lezen data
  // ophalen en geen auth nodig hebben). Folder 1 = "Uncategorized", de enige geldige folder om
  // rechtstreeks aan toe te voegen (folder 0 "All" accepteert geen toevoegingen, zie Discogs' eigen
  // API-documentatie).
  async function addReleaseToDiscogsCollection(username, releaseId) {
    var url = 'https://api.discogs.com/users/' + encodeURIComponent(username) + '/collection/folders/1/releases/' + encodeURIComponent(releaseId);
    var res = await fetch(url, { method: 'POST', headers: { 'Authorization': 'Discogs token=' + DISCOGS_TOKEN } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  async function runDiscogsFetch(entry) {
    var flow = state.importFlow;
    try {
      var all = await fetchDiscogsCollection(entry.discogs_username);
      var seen = {};
      flow.works = all.filter(function (r) {
        if (seen[r.id]) return false;
        seen[r.id] = true; return true;
      }).map(function (r) {
        var bi = r.basic_information || {};
        return {
          id: String(r.id), title: bi.title || '(onbekende titel)',
          artist: (bi.artists && bi.artists[0] && bi.artists[0].name) || '',
          coverUrl: bi.cover_image || null, year: bi.year || null,
          formats: (bi.formats || []).map(function (f) { return f.name; })
        };
      });
      flow.works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      flow.selected = new Set();
      if (!flow.works.length) flow.error = 'Geen items gevonden in je Discogs-collectie.';
    } catch (e) {
      console.error('discogs import failed', e);
      flow.error = 'Ophalen van je Discogs-collectie is niet gelukt. Klopt de gebruikersnaam en staat de collectie op publiek?';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  // BGG's collection-endpoint bouwt de export server-side pas op bij de eerste aanvraag en geeft
  // dan meteen 202 terug ("nog bezig") i.p.v. te wachten — pas bij een volgende, identieke aanvraag
  // (na een korte pauze) komt de echte data. Bevestigd met een directe test: eerste aanroep 202,
  // 4 seconden later 200 met de volledige collectie. Vereist een Application Token (zie
  // BGG_APP_TOKEN hierboven, sinds 2026 verplicht voor de hele XML-API).
  async function fetchBggCollectionXml(username) {
    // `&version=1` levert, wanneer de gebruiker een specifieke editie aan een spel gekoppeld heeft
    // in zijn eigen BGG-collectie, een <version>-blok met de uitgever van PRECIES die editie — in
    // tegenstelling tot BGG's `thing`-endpoint, die (zonder editie-context) de uitgevers van ALLE
    // wereldwijde edities van een spel teruggeeft (bij een populair spel als Catan al gauw 50+), wat
    // voor "uitgever" onbruikbaar is. Niet elk item heeft een gekoppelde editie (bij deze gebruiker
    // ~74% van de collectie) — voor de rest blijft `uitgever` bewust leeg i.p.v. te gokken.
    var url = 'https://boardgamegeek.com/xmlapi2/collection?username=' + encodeURIComponent(username) + '&stats=1&own=1&version=1';
    for (var attempt = 0; attempt < 10; attempt++) {
      var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + BGG_APP_TOKEN } });
      if (res.status === 202) { await sleep(2000); continue; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    }
    throw new Error('BGG bleef te lang "bezig" (202) met de collectie opbouwen.');
  }
  // `<rank type="subtype" name="boardgame" value="…">` — value is een getal, of de letterlijke
  // tekst "Not Ranked" bij een spel zonder BGG-rank (veel voorkomend, ~1 op 3 in een steekproef) —
  // dan bewust geen rank opslaan i.p.v. die tekst zelf als "rank".
  function parseBggCollection(xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
    return items.map(function (itemEl) {
      var id = itemEl.getAttribute('objectid');
      var nameEl = itemEl.getElementsByTagName('name')[0];
      var yearEl = itemEl.getElementsByTagName('yearpublished')[0];
      var thumbEl = itemEl.getElementsByTagName('thumbnail')[0];
      var imgEl = itemEl.getElementsByTagName('image')[0];
      var rank = null;
      var rankEls = itemEl.getElementsByTagName('rank');
      for (var i = 0; i < rankEls.length; i++) {
        if (rankEls[i].getAttribute('name') === 'boardgame') {
          var v = rankEls[i].getAttribute('value');
          if (v && v !== 'Not Ranked') rank = v;
          break;
        }
      }
      var publisher = null;
      var versionEl = itemEl.getElementsByTagName('version')[0];
      if (versionEl) {
        var verLinks = versionEl.getElementsByTagName('link');
        for (var j = 0; j < verLinks.length; j++) {
          if (verLinks[j].getAttribute('type') === 'boardgamepublisher') { publisher = verLinks[j].getAttribute('value'); break; }
        }
      }
      return {
        id: id, title: nameEl ? nameEl.textContent : '(onbekende titel)',
        year: yearEl ? yearEl.textContent : null,
        coverUrl: (thumbEl && thumbEl.textContent) || (imgEl && imgEl.textContent) || null,
        rank: rank, publisher: publisher
      };
    }).filter(function (w) { return w.id; });
  }
  async function runBggFetch(entry) {
    var flow = state.importFlow;
    try {
      var username = entry.bgg_username;
      var xml = await fetchBggCollectionXml(username);
      var seen = {};
      flow.works = parseBggCollection(xml).filter(function (w) {
        if (seen[w.id]) return false;
        seen[w.id] = true; return true;
      }).map(function (w) {
        return { id: w.id, title: w.title, coverUrl: w.coverUrl, year: w.year ? Number(w.year) : null, rank: w.rank, publisher: w.publisher };
      });
      flow.works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      flow.selected = new Set();
      if (!flow.works.length) flow.error = 'Geen items gevonden in je BGG-collectie.';
    } catch (e) {
      console.error('bgg import failed', e);
      flow.error = 'Ophalen van je BGG-collectie is niet gelukt. Klopt de gebruikersnaam?';
    } finally {
      flow.loading = false; renderDetail();
    }
  }
  // Werkt alleen bestaande, al geïmporteerde items bij (matcht op extern_id) — voegt niets nieuws
  // toe, dat gaat via de gewone importflow hierboven. Ranks veranderen namelijk voortdurend op BGG,
  // titel/cover niet, dus dit is de enige data die het waard is om apart te kunnen verversen.
  async function refreshBggRanks(entry) {
    if (state.bggRefreshing[entry.id]) return;
    var existing = itemsFor(entry.id).filter(function (i) { return i.bron === 'bgg' && i.extern_id; });
    var bggRankKey = (entry.extra_velden || []).some(function (f) { return f.key === 'bgg_rank'; }) ? 'bgg_rank' : null;
    if (!existing.length || !bggRankKey) return;
    state.bggRefreshing[entry.id] = true; renderDetail();
    try {
      var xml = await fetchBggCollectionXml(entry.bgg_username);
      var rankById = {};
      parseBggCollection(xml).forEach(function (w) { rankById[w.id] = w.rank; });
      for (var i = 0; i < existing.length; i++) {
        var item = existing[i];
        if (!rankById.hasOwnProperty(item.extern_id)) continue;
        var extra = Object.assign({}, item.extra || {});
        var newRank = rankById[item.extern_id];
        extra[bggRankKey] = newRank ? String(newRank) : null;
        await supabase.from('lijst_items').update({ extra: extra }).eq('id', item.id);
      }
      await refetchAll();
    } catch (e) {
      console.error('bgg rank refresh failed', e);
      window.alert('BGG-ranks verversen is niet gelukt.');
    } finally {
      state.bggRefreshing[entry.id] = false; renderDetail();
    }
  }
  // BGG's `thing`-endpoint (in tegenstelling tot `collection`) geeft ontwerper(s) per spel — geen
  // 202-ophoud-gedrag hier, dat is uniek voor `collection` (die per-gebruiker on-the-fly wordt
  // opgebouwd). Accepteert een kommagescheiden lijst van ids in één aanroep.
  // Video's bewust NIET automatisch (meer) opgehaald: BGG's eigen "instructional"-categorie als
  // filter bleek voor de eigenaar geen goed criterium — hij zoekt uitlegvideo's liever zelf uit,
  // desgevraagd met hulp van Claude om specifieke, door hem aangewezen sites te doorzoeken. Het
  // `videos`-tekstveld (multiline, zie extra_velden bij het Bordspellen-preset) blijft gewoon
  // bestaan voor handmatige invoer, alleen de automatische BGG-videoharvest is eruit.
  async function fetchBggThingBatch(ids) {
    var url = 'https://boardgamegeek.com/xmlapi2/thing?id=' + ids.join(',');
    var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + BGG_APP_TOKEN } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
    var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
    var byId = {};
    items.forEach(function (itemEl) {
      var id = itemEl.getAttribute('id');
      var links = Array.prototype.slice.call(itemEl.getElementsByTagName('link'));
      var designers = links.filter(function (l) { return l.getAttribute('type') === 'boardgamedesigner' && l.getAttribute('value') !== '(Uncredited)'; })
        .map(function (l) { return l.getAttribute('value'); });
      byId[id] = { designer: designers.join(', ') || null };
    });
    return byId;
  }
  // Batcht in groepjes van 15 ids met een korte pauze ertussen, zelfde voorzichtige patroon als de
  // Discogs-tracklist-backfill elders in dit bestand.
  async function fetchBggThingForIds(ids) {
    var byId = {};
    for (var i = 0; i < ids.length; i += 15) {
      var chunk = ids.slice(i, i + 15);
      Object.assign(byId, await fetchBggThingBatch(chunk));
      if (i + 15 < ids.length) await sleep(1500);
    }
    return byId;
  }
  // Vult auteur/uitgever alleen aan waar ze nog ontbreken (eenmalige backfill, geen doorlopende
  // "ververs"-actie zoals bij rank — die twee veranderen nooit meer voor een bestaand spel).
  // Uitgever komt gratis mee uit een collection-herhaling (met &version=1, zie
  // fetchBggCollectionXml); auteur vereist de aparte thing-batch hierboven. Video's zitten hier
  // bewust niet (meer) bij — zie de toelichting bij fetchBggThingBatch().
  async function fillBggExtras(entry) {
    if (state.bggEnriching[entry.id]) return;
    var auteurKey = (entry.extra_velden || []).some(function (f) { return f.key === 'auteur'; }) ? 'auteur' : null;
    var uitgeverKey = (entry.extra_velden || []).some(function (f) { return f.key === 'uitgever'; }) ? 'uitgever' : null;
    var existing = itemsFor(entry.id).filter(function (i) { return i.bron === 'bgg' && i.extern_id; });
    if (!existing.length) return;
    state.bggEnriching[entry.id] = true; renderDetail();
    try {
      if (uitgeverKey) {
        var missingPub = existing.filter(function (i) { return !(i.extra && i.extra[uitgeverKey]); });
        if (missingPub.length) {
          var xml = await fetchBggCollectionXml(entry.bgg_username);
          var pubById = {};
          parseBggCollection(xml).forEach(function (w) { pubById[w.id] = w.publisher; });
          for (var p = 0; p < missingPub.length; p++) {
            var pi = missingPub[p];
            if (!pubById[pi.extern_id]) continue;
            var pExtra = Object.assign({}, pi.extra || {});
            pExtra[uitgeverKey] = pubById[pi.extern_id];
            await supabase.from('lijst_items').update({ extra: pExtra }).eq('id', pi.id);
          }
        }
      }
      if (auteurKey) {
        var missingThing = existing.filter(function (i) { return !(i.extra && i.extra[auteurKey]); });
        if (missingThing.length) {
          var thingById = await fetchBggThingForIds(missingThing.map(function (i) { return i.extern_id; }));
          for (var t = 0; t < missingThing.length; t++) {
            var ti = missingThing[t];
            var info = thingById[ti.extern_id];
            if (!info || !info.designer) continue;
            var tExtra = Object.assign({}, ti.extra || {});
            tExtra[auteurKey] = info.designer;
            await supabase.from('lijst_items').update({ extra: tExtra }).eq('id', ti.id);
          }
        }
      }
      await refetchAll();
    } catch (e) {
      console.error('bgg extras backfill failed', e);
      window.alert('Auteur/uitgever aanvullen is niet gelukt.');
    } finally {
      state.bggEnriching[entry.id] = false; renderDetail();
    }
  }

  // ---------- Vergelijken met BGG/Discogs ----------
  // Generiek over beide bronnen (net als de rest van de import-machinerie) — laat twee dingen zien
  // die de gewone import-knop niet dekt: items die uit de externe collectie zijn verdwenen (mogelijk
  // verkocht/weggedaan) en items in Lijster die nooit vanuit die bron bevestigd zijn. Bewust GEEN
  // automatische verwijdering of (bij BGG) toevoeging — altijd een expliciete handeling per item,
  // op verzoek van de eigenaar ("actief knop drukken, niet volautomatisch... lijstje zien").
  function openCompareFlow(entry) {
    state.compareFlow = { listId: entry.id, source: entry.auto_import, loading: true, error: '', notConfirmed: [], removedFromSource: [] };
    renderDetail();
    resetItemsScroll();
    runCompareFlow(entry);
  }
  function closeCompareFlow() { state.compareFlow = null; renderDetail(); }

  async function runCompareFlow(entry) {
    var cmp = state.compareFlow;
    try {
      var externalIds = {};
      if (cmp.source === 'bgg') {
        var xml = await fetchBggCollectionXml(entry.bgg_username);
        parseBggCollection(xml).forEach(function (w) { externalIds[w.id] = true; });
      } else if (cmp.source === 'discogs') {
        var releases = await fetchDiscogsCollection(entry.discogs_username);
        releases.forEach(function (r) { externalIds[String(r.id)] = true; });
      }
      var items = itemsFor(entry.id);
      cmp.removedFromSource = items.filter(function (i) { return i.bron === cmp.source && i.extern_id && !externalIds[i.extern_id]; });
      cmp.notConfirmed = items.filter(function (i) { return i.bron !== cmp.source; });
    } catch (e) {
      console.error('compare failed', e);
      cmp.error = 'Vergelijken is niet gelukt. Klopt de gebruikersnaam?';
    } finally {
      cmp.loading = false; renderDetail();
    }
  }

  async function importSearch(query) {
    var flow = state.importFlow;
    flow.query = query; flow.loading = true; flow.error = ''; renderDetail();
    try {
      var res = await fetch('https://openlibrary.org/search/authors.json?q=' + encodeURIComponent(query));
      var data = await res.json();
      flow.candidates = (data.docs || []).slice(0, 8).map(function (d) {
        return { id: d.key, name: d.name, meta: [d.birth_date, d.work_count ? (d.work_count + ' werken') : null].filter(Boolean).join(' · ') };
      });
      flow.step = 'candidates';
      if (!flow.candidates.length) flow.error = 'Geen resultaten voor "' + query + '".';
    } catch (e) {
      console.error('import search failed', e);
      flow.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  async function importPickCandidate(cand) {
    var flow = state.importFlow;
    flow.candidateName = cand.name; flow.candidateId = cand.id;
    flow.loading = true; flow.error = ''; flow.note = ''; renderDetail();
    try {
      var works = [];
      var q = 'author_key:' + cand.id + ' AND language:dut';
      var res = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q)
        + '&editions.language=dut&limit=300&fields=key,title,cover_i,first_publish_year,editions,editions.title,editions.cover_i');
      var data = await res.json();
      var seen = {};
      (data.docs || []).forEach(function (w) {
        var ed = w.editions && w.editions.docs && w.editions.docs[0];
        var title = (ed && ed.title) || w.title;
        var coverId = (ed && ed.cover_i) || w.cover_i;
        var norm = (title || '').trim().toLowerCase();
        if (!norm || seen[norm]) return;
        seen[norm] = true;
        works.push({ id: w.key, title: title, coverUrl: coverId ? ('https://covers.openlibrary.org/b/id/' + coverId + '-M.jpg') : null, year: w.first_publish_year || null });
      });
      if (!works.length) {
        // Sommige titels missen taalmetadata in Open Library, ook als het werk zelf al een
        // Nederlandse (vertaal)titel heeft (vaak bij recentere/kinderboeken) — val dan terug
        // op alle werken van de auteur i.p.v. niets te tonen.
        var res3 = await fetch('https://openlibrary.org/search.json?author_key=' + encodeURIComponent(cand.id) + '&limit=300&fields=key,title,cover_i,first_publish_year');
        var data3 = await res3.json();
        (data3.docs || []).forEach(function (w) {
          var norm = (w.title || '').trim().toLowerCase();
          if (!norm || seen[norm]) return;
          seen[norm] = true;
          works.push({ id: w.key, title: w.title, coverUrl: w.cover_i ? ('https://covers.openlibrary.org/b/id/' + w.cover_i + '-M.jpg') : null, year: w.first_publish_year || null });
        });
        if (works.length) flow.note = 'Geen titels met Nederlandse taalmarkering gevonden bij Open Library — onderstaande titels zijn mogelijk niet in het Nederlands.';
      }
      works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      flow.works = works;
      flow.selected = new Set();
      flow.step = 'works';
      if (!works.length) flow.error = 'Geen titels gevonden.';
    } catch (e) {
      console.error('import fetch works failed', e);
      flow.error = 'Ophalen is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  async function fetchDiscogsReleaseDetail(releaseId) {
    try {
      var res = await fetch('https://api.discogs.com/releases/' + encodeURIComponent(releaseId));
      if (!res.ok) return null;
      var data = await res.json();
      var list = data.tracklist || [];
      var tracklist = list.length ? list.map(function (t) {
        var pos = t.position ? t.position + '. ' : '';
        var dur = t.duration ? ' (' + t.duration + ')' : '';
        return (pos + (t.title || '') + dur).trim();
      }).filter(Boolean).join('\n') : null;
      var img = data.images && data.images.length ? (data.images[0].uri || data.images[0].resource_url) : null;
      return { tracklist: tracklist, coverUrl: img || null };
    } catch (e) {
      console.error('discogs release detail fetch failed', e);
      return null;
    }
  }
  async function fetchDiscogsTracklist(releaseId) {
    var detail = await fetchDiscogsReleaseDetail(releaseId);
    return detail ? detail.tracklist : null;
  }

  // ---------- Tracklist ophalen via Discogs (los, per item zonder tracklist) ----------
  // `syncToDiscogs`: alleen `true` als dit geopend is vanuit de "Vergelijk met Discogs"-lijst (zie
  // verderop) — dan voegt bevestigen de gekozen release ook echt toe aan de Discogs-collectie van
  // de gebruiker, naast de gewone tracklist-ophalen-functie hieronder. Bewust NIET de default voor
  // het gewone per-item "Tracklist ophalen"-knopje: dat blijft puur metadata ophalen, zonder
  // bijwerking op een extern account — anders zou je onverwacht iets aan je Discogs-collectie
  // toevoegen terwijl je alleen een tracklist wilde opzoeken.
  function openTrackSearch(item, entry, syncToDiscogs) {
    state.editingItem = null;
    // Vanuit "Vergelijk met Discogs" kan het item in een ingeklapte reeks zitten (of ver buiten
    // beeld) — zonder dit zou het zoekpaneel wel openen maar nergens zichtbaar verschijnen.
    if (syncToDiscogs && item.reeks_id) delete state.collapsedReeks[item.reeks_id];
    state.trackSearch = {
      itemId: item.id, listId: entry ? entry.id : null, syncToDiscogs: !!syncToDiscogs,
      step: 'candidates', loading: true, error: '', candidates: [], picked: null
    };
    renderDetail();
    resetItemsScroll();
    if (syncToDiscogs) {
      var rowEl = detailCardEl.querySelector('tr[data-item-id="' + item.id + '"]');
      if (rowEl) rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    runTrackSearch(item);
  }
  function closeTrackSearch() { state.trackSearch = null; renderDetail(); }

  async function runTrackSearch(item) {
    var ts = state.trackSearch;
    try {
      var rk = item.reeks_id ? state.reeksen.find(function (r) { return r.id === item.reeks_id; }) : null;
      var artist = rk ? rk.naam : '';
      var lp = !!(item.vinkjes && item.vinkjes.lp), cd = !!(item.vinkjes && item.vinkjes.cd);
      var formatParam = (lp && !cd) ? 'Vinyl' : ((cd && !lp) ? 'CD' : '');
      var url = 'https://api.discogs.com/database/search?type=release'
        + '&artist=' + encodeURIComponent(artist)
        + '&release_title=' + encodeURIComponent(item.titel || '')
        + (formatParam ? '&format=' + encodeURIComponent(formatParam) : '')
        + '&per_page=20';
      var res = await fetch(url);
      var data = await res.json();
      if (data.message) throw new Error(data.message);
      ts.candidates = (data.results || []).map(function (r) {
        return { id: r.id, title: r.title || '', year: r.year || null, formats: r.format || [], have: (r.community && r.community.have) || 0 };
      }).sort(function (a, b) { return b.have - a.have; });
      if (!ts.candidates.length) ts.error = 'Geen releases gevonden op Discogs voor "' + (item.titel || '') + '".';
    } catch (e) {
      console.error('discogs track search failed', e);
      ts.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      ts.loading = false; renderDetail();
    }
  }

  async function pickTrackCandidate(cand) {
    var ts = state.trackSearch;
    ts.loading = true; ts.error = ''; renderDetail();
    try {
      var detail = await fetchDiscogsReleaseDetail(cand.id);
      if (!detail || !detail.tracklist) {
        ts.error = 'Geen tracklist gevonden voor deze release. Probeer een andere.';
        ts.loading = false; renderDetail();
        return;
      }
      ts.picked = { id: cand.id, title: cand.title, year: cand.year, tracklist: detail.tracklist, coverUrl: detail.coverUrl };
      ts.step = 'confirm';
    } catch (e) {
      console.error('discogs release detail failed', e);
      ts.error = 'Ophalen is niet gelukt. Probeer het later opnieuw.';
    } finally {
      ts.loading = false; renderDetail();
    }
  }

  async function confirmTrackPick(item) {
    var ts = state.trackSearch;
    var picked = ts.picked;
    if (!picked) return;
    var patch = { tracklist: picked.tracklist };
    if (!item.omslag_url && picked.coverUrl) patch.omslag_url = picked.coverUrl;
    if (ts.syncToDiscogs) {
      var entry = state.lijsten.find(function (l) { return l.id === ts.listId; });
      if (entry && entry.discogs_username) {
        try {
          await addReleaseToDiscogsCollection(entry.discogs_username, picked.id);
          // Alleen bron/extern_id zetten als de Discogs-toevoeging ook echt lukte — anders blijft
          // dit item terecht in de "nog niet op Discogs"-lijst staan voor een nieuwe poging, i.p.v.
          // dat we een mislukte sync stilzwijgend als geslaagd markeren.
          patch.bron = 'discogs'; patch.extern_id = String(picked.id);
          if (state.compareFlow && state.compareFlow.listId === ts.listId) {
            state.compareFlow.notConfirmed = state.compareFlow.notConfirmed.filter(function (i) { return i.id !== item.id; });
          }
        } catch (e) {
          console.error('discogs collection add failed', e);
          window.alert('Toevoegen aan je Discogs-collectie is niet gelukt. De tracklist is wel opgeslagen; je kunt het later opnieuw proberen via "Vergelijk met Discogs".');
        }
      }
    }
    state.trackSearch = null;
    var result = await supabase.from('lijst_items').update(patch).eq('id', item.id);
    refetchSoft(result);
  }

  async function importCommit(entry) {
    var flow = state.importFlow;
    var existingExternIds = {};
    itemsFor(entry.id).forEach(function (i) { if (i.extern_id) existingExternIds[i.extern_id] = true; });
    var extraKey = entry.extra_velden && entry.extra_velden[0] ? entry.extra_velden[0].key : null;
    var base = Date.now();
    var selectedWorks = flow.works.filter(function (w) { return flow.selected.has(w.id) && !existingExternIds[w.id]; });
    closeImportFlow();
    if (!selectedWorks.length) return;

    var reeksByName = {};
    var singleReeksId = null;
    if (entry.genest && !flow.reeksId && flow.source === 'discogs') {
      reeksenFor(entry.id).forEach(function (r) { reeksByName[normalizeReeksNaam(r.naam)] = r; });
      var neededNames = {};
      selectedWorks.forEach(function (w) {
        var n = (w.artist || '').trim();
        var norm = normalizeReeksNaam(n);
        if (n && norm && !reeksByName[norm] && !neededNames[norm]) neededNames[norm] = n;
      });
      var toCreate = Object.keys(neededNames).map(function (k) { return neededNames[k]; });
      if (toCreate.length) {
        var newReeksRows = toCreate.map(function (naam, i) { return { lijst_id: entry.id, naam: naam, volgorde: base + i }; });
        var reeksInsertRes = await supabase.from('reeksen').insert(newReeksRows).select();
        (reeksInsertRes.data || []).forEach(function (r) { reeksByName[normalizeReeksNaam(r.naam)] = r; });
      }
    } else if (entry.genest && !flow.reeksId && flow.candidateName) {
      var reeksRes2 = await findOrCreateReeks(entry, flow.candidateName);
      if (reeksRes2.error || !reeksRes2.data) { console.error(reeksRes2.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      singleReeksId = reeksRes2.data.id;
    }

    var jaarKey = (entry.extra_velden || []).some(function (f) { return f.key === 'jaar'; }) ? 'jaar' : null;
    var bggRankKey = (entry.extra_velden || []).some(function (f) { return f.key === 'bgg_rank'; }) ? 'bgg_rank' : null;
    var uitgeverKey = (entry.extra_velden || []).some(function (f) { return f.key === 'uitgever'; }) ? 'uitgever' : null;
    var auteurKey = (entry.extra_velden || []).some(function (f) { return f.key === 'auteur'; }) ? 'auteur' : null;
    var rows = [];
    for (var wi = 0; wi < selectedWorks.length; wi++) {
      var w = selectedWorks[wi];
      var extra = {};
      if (entry.genest) {
        if (jaarKey && w.year) extra[jaarKey] = String(w.year);
      } else if (flow.source === 'bgg') {
        // Rank en (indien de gebruiker een editie aan het spel gekoppeld heeft in zijn eigen BGG-
        // collectie) uitgever komen al gratis mee uit het collection-endpoint. Ontwerper vereist een
        // aparte thing-endpoint-aanroep per spel — gebeurt hieronder, ná het inserten, voor deze
        // batch (zie fillBggExtras() voor dezelfde aanvulling achteraf op bestaande items). Video's
        // worden bewust niet automatisch ingevuld, zie fetchBggThingBatch().
        if (bggRankKey && w.rank) extra[bggRankKey] = String(w.rank);
        if (uitgeverKey && w.publisher) extra[uitgeverKey] = w.publisher;
      } else if (extraKey) {
        extra[extraKey] = flow.source === 'discogs' ? (w.artist || '') : flow.candidateName;
      }
      var vinkjes = {};
      (entry.vink_velden || []).forEach(function (vk) { vinkjes[vk.key] = false; });
      var tracklist = null;
      if (flow.source === 'discogs') {
        if (vinkjes.hasOwnProperty('in_bezit')) vinkjes.in_bezit = true;
        var fmts = w.formats || [];
        if (vinkjes.hasOwnProperty('lp') && fmts.indexOf('Vinyl') !== -1) vinkjes.lp = true;
        if (vinkjes.hasOwnProperty('cd') && fmts.indexOf('CD') !== -1) vinkjes.cd = true;
        tracklist = await fetchDiscogsTracklist(w.id);
        if (wi < selectedWorks.length - 1) await sleep(300);
      }
      var row = { lijst_id: entry.id, titel: w.title, extra: extra, vinkjes: vinkjes, bron: flow.source, extern_id: w.id, omslag_url: w.coverUrl || null, tracklist: tracklist, volgorde: base + wi };
      if (flow.reeksId) row.reeks_id = flow.reeksId;
      else if (entry.genest && flow.source === 'discogs') {
        var n = (w.artist || '').trim();
        var rk = n ? reeksByName[normalizeReeksNaam(n)] : null;
        if (rk) row.reeks_id = rk.id;
      } else if (entry.genest && singleReeksId) {
        row.reeks_id = singleReeksId;
      }
      rows.push(row);
    }
    var result = await supabase.from('lijst_items').insert(rows).select();
    await refetchSoft(result);
    // Ontwerper zit niet in het collection-endpoint (zie hierboven) — voor een verse BGG-import
    // meteen aanvullen via de thing-batch, zodat een nieuw geïmporteerd spel niet als enige zonder
    // deze gegevens komt te staan tot iemand de "aanvullen"-knop gebruikt.
    if (flow.source === 'bgg' && auteurKey && result.data && result.data.length) {
      try {
        var thingById = await fetchBggThingForIds(result.data.map(function (r) { return r.extern_id; }));
        for (var ri = 0; ri < result.data.length; ri++) {
          var r = result.data[ri];
          var info = thingById[r.extern_id];
          if (!info || !info.designer) continue;
          var rExtra = Object.assign({}, r.extra || {});
          rExtra[auteurKey] = info.designer;
          await supabase.from('lijst_items').update({ extra: rExtra }).eq('id', r.id);
        }
        await refetchAll();
      } catch (e) {
        console.error('bgg extras na import mislukt', e);
      }
    }
  }

  function renderImportSection(entry) {
    var wrap = document.createElement('div');
    var flow = state.importFlow;
    var cmp = state.compareFlow;
    if (cmp && cmp.listId === entry.id) {
      wrap.appendChild(buildComparePanel(entry));
      return wrap;
    }
    if (flow && flow.listId === entry.id && flow.source !== entry.auto_import) return wrap;
    if (!flow || flow.listId !== entry.id) {
      // Discogs' bulk-collectie-import stond eerder als los download-icoontje in de compacte
      // koprij (naast tandwiel/camera) — inconsistent met de rest van het "Toevoegen"-tabblad, waar
      // juist alle manieren om iets toe te voegen bij elkaar horen te staan. Nu net als Open Library
      // gewoon een knop hier, mits er al een Discogs-gebruikersnaam is ingevuld.
      var missingUsername = (entry.auto_import === 'discogs' && !entry.discogs_username)
        || (entry.auto_import === 'bgg' && !entry.bgg_username);
      if (missingUsername) {
        var row2 = document.createElement('div'); row2.className = 'import-toggle-row';
        var hint = document.createElement('p'); hint.className = 'import-msg';
        hint.textContent = entry.auto_import === 'bgg'
          ? 'Vul je BGG-gebruikersnaam in bij "Velden bewerken" om te kunnen importeren.'
          : 'Vul je Discogs-gebruikersnaam in bij "Velden bewerken" om te kunnen importeren.';
        row2.appendChild(hint);
        wrap.appendChild(row2);
      } else {
        var row = document.createElement('div'); row.className = 'import-toggle-row';
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'btn-secondary'; btn.textContent = IMPORT_LABELS[entry.auto_import] || 'Toevoegen';
        btn.addEventListener('click', function () { openImportFlow(entry); });
        row.appendChild(btn);
        if (entry.auto_import === 'bgg' && itemsFor(entry.id).some(function (i) { return i.bron === 'bgg'; })) {
          var refreshBtn = document.createElement('button');
          refreshBtn.type = 'button'; refreshBtn.className = 'btn-text';
          refreshBtn.textContent = state.bggRefreshing[entry.id] ? 'Bezig…' : 'Ranks verversen';
          refreshBtn.disabled = !!state.bggRefreshing[entry.id];
          refreshBtn.addEventListener('click', function () { refreshBggRanks(entry); });
          row.appendChild(refreshBtn);
          // Alleen op ontbrekende auteur checken, niet op uitgever: bijna elk BGG-spel heeft een
          // gecrediteerde ontwerper (dus dit convergeert na één run naar "klaar"), maar uitgever
          // blijft voor spellen zonder gekoppelde editie in de eigen BGG-collectie blijvend leeg —
          // zou de knop anders voor altijd zichtbaar houden voor spellen die toch nooit een uitgever
          // krijgen.
          var needsExtras = itemsFor(entry.id).some(function (i) {
            return i.bron === 'bgg' && i.extern_id && !(i.extra && i.extra.auteur);
          });
          if (needsExtras) {
            var fillBtn = document.createElement('button');
            fillBtn.type = 'button'; fillBtn.className = 'btn-text';
            fillBtn.textContent = state.bggEnriching[entry.id] ? 'Bezig…' : 'Auteur/uitgever aanvullen';
            fillBtn.disabled = !!state.bggEnriching[entry.id];
            fillBtn.addEventListener('click', function () { fillBggExtras(entry); });
            row.appendChild(fillBtn);
          }
        }
        if ((entry.auto_import === 'bgg' || entry.auto_import === 'discogs') && itemsFor(entry.id).length > 0) {
          var compareBtn = document.createElement('button');
          compareBtn.type = 'button'; compareBtn.className = 'btn-text';
          compareBtn.textContent = 'Vergelijk met ' + (entry.auto_import === 'bgg' ? 'BGG' : 'Discogs');
          compareBtn.addEventListener('click', function () { openCompareFlow(entry); });
          row.appendChild(compareBtn);
        }
        wrap.appendChild(row);
        if (entry.auto_import === 'bgg') {
          // BGG's gebruiksvoorwaarden vereisen een bronvermelding met link terug voor een
          // publiek-gerichte app (zie using_the_xml_api) — een eigen officieel logo-plaatje hosten
          // leek voor dit doel niet nodig, een duidelijke tekstlink dekt de geest van de eis.
          var attrRow = document.createElement('div'); attrRow.className = 'import-toggle-row';
          var attrP = document.createElement('p'); attrP.className = 'import-msg';
          var attrLink = document.createElement('a');
          attrLink.href = 'https://boardgamegeek.com'; attrLink.target = '_blank'; attrLink.rel = 'noopener';
          attrLink.textContent = 'BoardGameGeek.com';
          attrP.appendChild(document.createTextNode('Bordspelgegevens via '));
          attrP.appendChild(attrLink);
          attrRow.appendChild(attrP);
          wrap.appendChild(attrRow);
        }
      }
      return wrap;
    }
    wrap.appendChild(buildImportPanel(entry));
    return wrap;
  }

  function buildComparePanel(entry) {
    var cmp = state.compareFlow;
    var sourceLabel = cmp.source === 'bgg' ? 'BGG' : 'Discogs';
    var panel = document.createElement('div'); panel.className = 'import-panel wide-row-content';
    var header = document.createElement('div'); header.className = 'import-actions';
    var titleSpan = document.createElement('strong'); titleSpan.textContent = 'Vergelijk met ' + sourceLabel;
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button'; closeBtn.className = 'btn-text'; closeBtn.textContent = 'Sluiten';
    closeBtn.addEventListener('click', closeCompareFlow);
    header.appendChild(titleSpan); header.appendChild(closeBtn);
    panel.appendChild(header);

    if (cmp.loading) {
      var loadingP = document.createElement('p'); loadingP.className = 'import-msg'; loadingP.textContent = 'Vergelijken…';
      panel.appendChild(loadingP);
      return panel;
    }
    if (cmp.error) {
      var errP = document.createElement('p'); errP.className = 'import-msg error'; errP.textContent = cmp.error;
      panel.appendChild(errP);
      return panel;
    }

    if (cmp.notConfirmed.length) {
      var sub1 = document.createElement('p'); sub1.className = 'import-msg';
      sub1.textContent = cmp.notConfirmed.length + (cmp.notConfirmed.length === 1 ? ' item staat' : ' items staan')
        + ' niet (bevestigd) in je ' + sourceLabel + '-collectie:';
      panel.appendChild(sub1);
      var list1 = document.createElement('div'); list1.className = 'import-candidates';
      cmp.notConfirmed.forEach(function (item) {
        var row = document.createElement('div'); row.className = 'import-candidate import-candidate-row';
        var span = document.createElement('span'); span.textContent = item.titel;
        row.appendChild(span);
        if (cmp.source === 'bgg') {
          var link = document.createElement('a'); link.className = 'btn-text';
          link.href = 'https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=' + encodeURIComponent(item.titel);
          link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Zoek op BGG →';
          row.appendChild(link);
        } else {
          var addBtn = document.createElement('button');
          addBtn.type = 'button'; addBtn.className = 'btn-text';
          addBtn.textContent = 'Zoek & voeg toe aan Discogs';
          addBtn.addEventListener('click', function () { openTrackSearch(item, entry, true); });
          row.appendChild(addBtn);
        }
        list1.appendChild(row);
      });
      panel.appendChild(list1);
    }

    if (cmp.removedFromSource.length) {
      var sub2 = document.createElement('p'); sub2.className = 'import-msg';
      sub2.textContent = cmp.removedFromSource.length + (cmp.removedFromSource.length === 1 ? ' item staat' : ' items staan')
        + ' niet meer in je ' + sourceLabel + '-collectie:';
      panel.appendChild(sub2);
      var list2 = document.createElement('div'); list2.className = 'import-candidates';
      cmp.removedFromSource.forEach(function (item) {
        var row2 = document.createElement('div'); row2.className = 'import-candidate import-candidate-row';
        var span2 = document.createElement('span'); span2.textContent = item.titel;
        var delBtn = document.createElement('button');
        delBtn.type = 'button'; delBtn.className = 'btn-text danger'; delBtn.textContent = 'Verwijder uit Lijster';
        delBtn.addEventListener('click', function () {
          supabase.from('lijst_items').delete().eq('id', item.id).then(refetchSoft);
          cmp.removedFromSource = cmp.removedFromSource.filter(function (i) { return i.id !== item.id; });
          renderDetail();
        });
        row2.appendChild(span2); row2.appendChild(delBtn);
        list2.appendChild(row2);
      });
      panel.appendChild(list2);
    }

    if (!cmp.notConfirmed.length && !cmp.removedFromSource.length) {
      var okP = document.createElement('p'); okP.className = 'import-msg';
      okP.textContent = 'Geen verschillen gevonden — Lijster en je ' + sourceLabel + '-collectie komen overeen.';
      panel.appendChild(okP);
    }
    return panel;
  }

  function buildImportPanel(entry) {
    var flow = state.importFlow;
    var panel = document.createElement('div'); panel.className = 'import-panel wide-row-content';
    var header = document.createElement('div'); header.className = 'import-actions';
    var titleSpan = document.createElement('strong');
    titleSpan.textContent = flow.reeksId ? ('Titels zoeken op ' + (REEKS_SEARCH_LABELS[flow.source] || flow.source)) : (IMPORT_LABELS[flow.source] || 'Toevoegen');
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button'; closeBtn.className = 'btn-text'; closeBtn.textContent = 'Sluiten';
    closeBtn.addEventListener('click', closeImportFlow);
    header.appendChild(titleSpan); header.appendChild(closeBtn);
    panel.appendChild(header);

    if (flow.step === 'search') {
      var searchRow = document.createElement('div'); searchRow.className = 'import-search';
      var input = document.createElement('input');
      input.type = 'text'; input.placeholder = entry.auto_import === 'openlibrary' ? 'Naam van de auteur' : 'Naam van de artiest';
      input.value = flow.query;
      var searchBtn = document.createElement('button');
      searchBtn.type = 'button'; searchBtn.className = 'btn-primary'; searchBtn.textContent = flow.loading ? 'Bezig…' : 'Zoeken';
      searchBtn.disabled = flow.loading;
      function go() { var v = input.value.trim(); if (v) importSearch(v); }
      searchBtn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      searchRow.appendChild(input); searchRow.appendChild(searchBtn);
      panel.appendChild(searchRow);
      setTimeout(function () { input.focus(); }, 0);
    } else if (flow.step === 'candidates') {
      var list = document.createElement('div'); list.className = 'import-candidates';
      flow.candidates.forEach(function (c) {
        var cb = document.createElement('button');
        cb.type = 'button'; cb.className = 'import-candidate';
        var nameEl = document.createElement('span'); nameEl.textContent = c.name;
        cb.appendChild(nameEl);
        if (c.meta) { var small = document.createElement('small'); small.textContent = c.meta; cb.appendChild(small); }
        cb.addEventListener('click', function () { importPickCandidate(c); });
        list.appendChild(cb);
      });
      panel.appendChild(list);
      var backToSearch = document.createElement('button');
      backToSearch.type = 'button'; backToSearch.className = 'btn-text'; backToSearch.textContent = '← Opnieuw zoeken';
      backToSearch.addEventListener('click', function () { flow.step = 'search'; flow.error = ''; renderDetail(); });
      panel.appendChild(backToSearch);
    } else if (flow.step === 'works') {
      if (flow.loading) {
        var loadingP = document.createElement('p'); loadingP.className = 'import-msg';
        loadingP.textContent = (flow.source === 'discogs' || flow.source === 'bgg') ? 'Collectie ophalen…' : 'Bezig…';
        panel.appendChild(loadingP);
      } else {
        var sub = document.createElement('p'); sub.className = 'import-msg';
        var msg;
        if (flow.source === 'discogs') msg = flow.works.length + ' items gevonden in je Discogs-collectie.';
        else if (flow.source === 'bgg') msg = flow.works.length + ' spellen gevonden in je BGG-collectie.';
        else if (flow.source === 'openlibrary') msg = flow.works.length + (flow.note ? ' titels gevonden voor ' : ' Nederlandstalige titels gevonden voor ') + flow.candidateName + '.';
        else msg = flow.works.length + ' titels gevonden voor ' + flow.candidateName + '.';
        sub.textContent = msg + ' Vink aan wat je wilt toevoegen.';
        panel.appendChild(sub);
        if (flow.works.length > 1) {
          var selectRow = document.createElement('div'); selectRow.className = 'import-select-row';
          var selectAllBtn = document.createElement('button');
          selectAllBtn.type = 'button'; selectAllBtn.className = 'btn-text'; selectAllBtn.textContent = 'Alles selecteren';
          selectAllBtn.addEventListener('click', function () {
            flow.works.forEach(function (w) { flow.selected.add(w.id); });
            renderDetail();
          });
          var selectNoneBtn = document.createElement('button');
          selectNoneBtn.type = 'button'; selectNoneBtn.className = 'btn-text'; selectNoneBtn.textContent = 'Niets selecteren';
          selectNoneBtn.addEventListener('click', function () { flow.selected.clear(); renderDetail(); });
          selectRow.appendChild(selectAllBtn); selectRow.appendChild(selectNoneBtn);
          panel.appendChild(selectRow);
        }
        if (flow.note) {
          var noteP = document.createElement('p'); noteP.className = 'import-msg'; noteP.textContent = flow.note;
          panel.appendChild(noteP);
        }
        if (flow.source !== 'discogs' && flow.candidates.length > 1) {
          var backToCandidates = document.createElement('button');
          backToCandidates.type = 'button'; backToCandidates.className = 'btn-text';
          backToCandidates.textContent = '← Andere kandidaat proberen';
          backToCandidates.addEventListener('click', function () { flow.step = 'candidates'; flow.error = ''; flow.note = ''; renderDetail(); });
          panel.appendChild(backToCandidates);
        }
        var worksList = document.createElement('div'); worksList.className = 'import-works';
        flow.works.forEach(function (w) {
          var row = document.createElement('label'); row.className = 'import-work-row';
          var cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = flow.selected.has(w.id);
          cb.addEventListener('change', function () {
            if (cb.checked) flow.selected.add(w.id); else flow.selected.delete(w.id);
            addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
          });
          row.appendChild(cb);
          if (w.coverUrl) {
            var thumb = document.createElement('img'); thumb.className = 'import-work-thumb'; thumb.src = w.coverUrl; thumb.alt = ''; thumb.loading = 'lazy';
            row.appendChild(thumb);
          }
          var span = document.createElement('span');
          span.textContent = w.title + (w.artist ? ' — ' + w.artist : '') + (w.year ? ' (' + w.year + ')' : '')
            + (w.rank ? ' · rank ' + w.rank : '');
          row.appendChild(span);
          worksList.appendChild(row);
        });
        panel.appendChild(worksList);
        var commitRow = document.createElement('div'); commitRow.className = 'import-actions';
        var addBtn = document.createElement('button');
        addBtn.type = 'button'; addBtn.className = 'btn-primary';
        addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
        addBtn.disabled = !flow.works.length;
        addBtn.addEventListener('click', function () { importCommit(entry); });
        commitRow.appendChild(addBtn);
        panel.appendChild(commitRow);
      }
    }

    if (flow.error) {
      var errP = document.createElement('p'); errP.className = 'import-msg error'; errP.textContent = flow.error;
      panel.appendChild(errP);
    }

    return panel;
  }

  // ---------- Data ----------
  // Een ongefilterde `select('*')` levert bij Supabase/PostgREST standaard maximaal 1000 rijen op
  // (server-side max-rows-cap, geen foutmelding bij afkappen) — met alle lijstjes samen inmiddels
  // ruim boven de 1000 items (vooral door de BGG-bulkimport) werden de nieuwste rijen daardoor
  // stilzwijgend niet meer opgehaald. `.range()` in een lus haalt alles op, ongeacht hoeveel rijen
  // de tabel ooit bevat.
  async function fetchAllRows(table, orderCol) {
    var pageSize = 1000, rows = [], from = 0;
    while (true) {
      var res = await supabase.from(table).select('*').order(orderCol, { ascending: true }).range(from, from + pageSize - 1);
      if (res.error) return res;
      rows = rows.concat(res.data || []);
      if (!res.data || res.data.length < pageSize) break;
      from += pageSize;
    }
    return { data: rows, error: null };
  }
  async function refetchAll() {
    var res = await Promise.all([
      fetchAllRows('lijsten', 'volgorde'),
      fetchAllRows('lijst_items', 'volgorde'),
      fetchAllRows('reeksen', 'volgorde')
    ]);
    var lijstenRes = res[0], itemsRes = res[1], reeksenRes = res[2];
    if (lijstenRes.error || itemsRes.error || reeksenRes.error) {
      console.error(lijstenRes.error || itemsRes.error || reeksenRes.error);
      showStatus('Kon lijstjes niet laden. Controleer je verbinding.');
      return;
    }
    showStatus('');
    state.lijsten = lijstenRes.data || [];
    state.items = itemsRes.data || [];
    state.reeksen = reeksenRes.data || [];
    renderOverview();
    if (state.currentId) renderDetail();
  }
  function refetchSoft(result) {
    if (result && result.error) { console.error(result.error); window.alert('Er ging iets mis bij het opslaan.'); }
    return refetchAll();
  }

  function subscribeRealtime() {
    supabase.channel('lijstjeslijst_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijsten' }, refetchAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijst_items' }, refetchAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reeksen' }, refetchAll)
      .subscribe();
  }

  function maybeShowInstallHint() {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    var dismissed = false;
    try { dismissed = localStorage.getItem('lijstjeslijst-install-hint-dismissed') === '1'; } catch (e) {}
    if (isIOS && !isStandalone && !dismissed) installHint.hidden = false;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').then(function (reg) {
        reg.update();
        setInterval(function () { reg.update(); }, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function (e) { console.error('SW registratie mislukt', e); });
      var refreshedAfterUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshedAfterUpdate) return;
        refreshedAfterUpdate = true;
        window.location.reload();
      });
    });
  }

  // Geknipte/gekopieerde afbeelding (bv. een screenshot) rechtstreeks als omslagfoto kunnen
  // plakken, als alternatief naast het bestaande "kies bestand"-knopje — bewust een ÉÉN keer
  // geregistreerde document-brede listener i.p.v. iets dat bij elke render opnieuw zou moeten
  // worden toegevoegd/verwijderd (de rest van de app bouwt bij elke wijziging de hele DOM opnieuw
  // op). Grijpt alleen in als het klembord daadwerkelijk een afbeelding bevat — gewoon tekst
  // plakken (in het zoekveld, een tekstveld, etc.) gaat altijd normaal door, want die paste-events
  // hebben nooit een image-item in clipboardData.items.
  document.addEventListener('paste', function (e) {
    if (!e.clipboardData || !e.clipboardData.items) return;
    var imageItem = Array.prototype.slice.call(e.clipboardData.items).find(function (it) {
      return it.kind === 'file' && it.type.indexOf('image/') === 0;
    });
    if (!imageItem) return;
    var file = imageItem.getAsFile();
    if (!file) return;
    if (state.editingItem) {
      var item = state.items.find(function (i) { return i.id === state.editingItem; });
      if (item) { e.preventDefault(); uploadItemCover(item, file); }
    } else if (state.currentId) {
      e.preventDefault(); uploadCover(state.currentId, file);
    }
  });

  document.getElementById('app-version').textContent = 'v' + APP_VERSION;
  maybeShowInstallHint();
  showStatus('Lijstjes laden…');
  refetchAll();
  subscribeRealtime();
})();
</script>
</body>
</html>
