<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lijster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lijster">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6F5E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #EFF1EA;
    --surface: #FBFBF7;
    --surface-2: #E4E7DD;
    --ink: #232620;
    --muted: #6E7266;
    --accent: #2F6F5E;
    --accent-ink: #F4F8F5;
    --accent-soft: #DCEAE3;
    --danger: #B5482F;
    --danger-soft: #F3E1DA;
    --border: #D8DBCF;
    --shadow: rgba(35,38,32,0.10);
    --focus: #2F6F5E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
      --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
      --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D18; --surface: #23261F; --surface-2: #2C2F27; --ink: #E9EAE1;
    --muted: #9DA294; --accent: #57B79B; --accent-ink: #0E211A; --accent-soft: #24443A;
    --danger: #E08064; --danger-soft: #402821; --border: #383B32; --shadow: rgba(0,0,0,0.4); --focus: #57B79B;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 90px; padding-top: calc(32px + env(safe-area-inset-top)); }
  @media (min-width: 640px) { .wrap { padding: 40px 28px 90px; padding-top: calc(40px + env(safe-area-inset-top)); } }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  h1.brand { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  p.tagline { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; font-style: italic; font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px;
    padding: 11px 18px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 2px var(--shadow); transition: transform 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px var(--shadow); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-secondary {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 14px; font-size: 0.85rem; font-weight: 500;
  }
  .btn-secondary:hover { background: var(--accent-soft); }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 0.86rem; padding: 6px 4px; }
  .btn-text:hover { color: var(--ink); }
  .btn-text.danger { color: var(--danger); }
  .btn-text.danger:hover { text-decoration: underline; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 0.82rem; padding: 4px 2px; align-self: flex-start; font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  main { position: relative; }
  [hidden] { display: none !important; }

  /* ---- Overview grid ---- */
  #grid { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 2px var(--shadow); cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; transition: transform 0.15s ease, box-shadow 0.15s ease; text-align: left; color: inherit;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 18px var(--shadow); }
  .card-cover { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex-shrink: 0; background: var(--surface-2); }
  .card-cover-placeholder {
    width: 52px; height: 52px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.3rem; color: var(--muted);
  }
  .card-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.02rem; margin: 0; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { display: flex; align-items: center; gap: 8px; }
  .pill { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .count-tag { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.72rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .card-controls { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 27px; height: 27px; border-radius: 7px; border: none; background: rgba(251,251,247,0.9); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; box-shadow: 0 1px 3px var(--shadow); flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--ink); background: var(--surface); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }

  .ghost-card { border: 1.5px dashed var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); grid-column: 1 / -1; }
  .ghost-card h3 { margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; }
  .template-choice { display: flex; gap: 8px; flex-wrap: wrap; }
  .template-btn {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 9px;
    padding: 9px 14px; font-size: 0.86rem; font-weight: 500; display: flex; flex-direction: column; gap: 2px; text-align: left;
  }
  .template-btn small { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
  .template-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row label { font-size: 0.76rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row input, .field-row textarea {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 9px 11px;
    font-family: inherit; font-size: 16px; color: var(--ink); resize: vertical;
  }
  .field-row input:focus, .field-row textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .ghost-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state p.big { font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem; color: var(--ink); margin: 0 0 6px; }

  /* ---- Detail view ---- */
  #detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px var(--shadow); }

  .cover-area { position: relative; width: 100%; }
  .cover-img { width: 100%; max-height: 260px; object-fit: cover; display: block; background: var(--surface-2); }
  .cover-actions { position: absolute; bottom: 10px; right: 12px; display: flex; gap: 8px; }
  .cover-actions .btn-secondary { background: rgba(251,251,247,0.92); }

  .detail-body { padding: 18px 24px 26px; }
  .detail-head { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; flex-wrap: wrap; }
  .detail-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 1.55rem; margin: 0; padding: 4px 2px; border: none;
    background: transparent; color: var(--ink); flex: 1 1 auto; min-width: 120px; }
  .detail-title:focus { outline: none; border-bottom: 1.5px solid var(--accent); }
  .detail-meta { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; flex-wrap: wrap; }
  hr.div { border: none; border-top: 1px solid var(--border); margin: 4px 0 14px; }

  .fields-toggle-row { margin-bottom: 4px; }

  .fields-editor { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 16px; }
  .fields-editor h4 { margin: 0 0 8px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  .fields-editor-group { display: flex; flex-direction: column; gap: 6px; }
  .fields-editor-row { display: flex; align-items: center; gap: 8px; }
  .fields-editor-row input { flex: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .fields-editor-desc { width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 8px 10px; font-family: inherit; font-size: 16px; color: var(--ink); resize: vertical; }

  .mode-tabs { display: flex; gap: 6px; margin: 0 0 14px; border-bottom: 1px solid var(--border); }
  .mode-tab-btn {
    border: none; background: none; padding: 8px 4px; margin-right: 14px; font-family: inherit; font-size: 0.9rem;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
  }
  .mode-tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .search-sort-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 14px; }
  .search-input-wrap { position: relative; flex: 1; min-width: 140px; }
  .search-input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 8px 30px 8px 12px; font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; background: none; color: var(--muted);
    font-size: 1.1rem; line-height: 1; cursor: pointer; border-radius: 50%;
  }
  .search-clear-btn:hover, .search-clear-btn:active { background: var(--surface-2); color: var(--ink); }
  .sort-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .sort-select {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 9px;
    font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .filter-row { display: flex; flex-wrap: wrap; gap: 14px 20px; margin: 0 0 16px; }
  .filter-group { display: flex; align-items: center; gap: 7px; }
  .filter-group .fg-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .filter-seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .filter-seg button { background: var(--surface); border: none; padding: 5px 10px; font-size: 0.76rem; color: var(--muted); }
  .filter-seg button + button { border-left: 1px solid var(--border); }
  .filter-seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .import-toggle-row { margin-bottom: 14px; }
  .import-panel { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .import-search { display: flex; gap: 8px; }
  .import-search input { flex: 1; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 11px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .import-candidates { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .import-candidate { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 11px; font-size: 0.86rem; }
  .import-candidate:hover { background: var(--accent-soft); }
  .import-candidate small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
  .import-works { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 10px; }
  .import-work-row { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; padding: 3px 0; }
  .import-work-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .import-work-thumb { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .import-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .import-msg { font-size: 0.84rem; color: var(--muted); font-style: italic; }
  .cover-search-row { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  .cover-search-msg { font-size: 0.84rem; color: var(--muted); font-style: italic; }
  .cover-search-candidates { display: flex; flex-wrap: wrap; gap: 10px; }
  .cover-search-candidate { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px; text-align: center; }
  .cover-search-candidate:hover { background: var(--accent-soft); }
  .cover-search-candidate img { width: 100%; height: 84px; object-fit: cover; border-radius: 4px; }
  .cover-search-candidate small { font-size: 0.72rem; color: var(--muted); line-height: 1.2; }
  .import-msg.error { color: var(--danger); font-style: normal; }
  .track-search-row { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  .track-candidates { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
  .track-candidate-btn {
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline; width: 100%;
    text-align: left; border: none; background: none; padding: 7px 4px; border-radius: 6px;
    font-size: 0.86rem; font-family: inherit; color: var(--ink); cursor: pointer;
  }
  .track-candidate-btn:hover { background: var(--accent-soft); }
  .track-candidate-btn .tc-meta { color: var(--muted); font-size: 0.78rem; flex-shrink: 0; white-space: nowrap; }
  .track-confirm-preview { display: flex; gap: 12px; align-items: flex-start; }
  .track-confirm-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--surface-2); flex-shrink: 0; }
  .track-confirm-tracklist { white-space: pre-wrap; font-size: 0.82rem; color: var(--ink); max-height: 220px; overflow-y: auto; flex: 1; margin: 0; }

  .reeks-row td { padding: 16px 4px 8px; border-bottom: none; }
  .reeks-row:first-child td { padding-top: 4px; }
  /* Rijen die colSpan="colCount" gebruiken (reeks-kop, bewerk-form, cover-/tracklist-zoeken) erven
     anders de volledige (JS-berekende, vaak bredere-dan-viewport) tabelbreedte — met alleen
     `overflow-x:auto` op `.items-scroll` blijft hun inhoud dan onzichtbaar totdat je toevallig naar
     rechts scrolt (bv. "Jaar van uitgave" bij Muziek/Strips, met hun extra vinkjes-kolommen, viel
     zo volledig buiten beeld op iPhone). `position:sticky;left:0` houdt zo'n rij bij de zichtbare
     linkerrand, en `max-width` (viewportbreedte min de vaste `.wrap`/`.detail-body`-marges) zorgt
     dat de al aanwezige `flex-wrap` ook echt naar een nieuwe regel omslaat i.p.v. verder door te
     lopen buiten beeld. */
  .wide-row-content { position: sticky; left: 0; max-width: calc(100vw - 88px); box-sizing: border-box; }
  @media (min-width: 640px) { .wide-row-content { max-width: calc(100vw - 96px); } }
  .reeks-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .reeks-collapse-btn { width: 20px; height: 20px; border: none; background: none; color: var(--muted); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0; font-size: 0.8rem; line-height: 0; }
  .reeks-collapse-btn:hover { color: var(--ink); }
  .reeks-name-input { flex: 1 1 120px; min-width: 100px; border: none; background: transparent; font-family: 'Fraunces', Georgia, serif;
    font-weight: 600; font-size: 1rem; color: var(--ink); padding: 3px 5px; border-radius: 6px; }
  .reeks-name-input:focus { outline: none; background: var(--surface-2); }
  .reeks-label-plain { flex: 1; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1rem; color: var(--muted); padding: 3px 5px; }
  .reeks-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .genest-add-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .genest-add-wrap { flex: 1 1 220px; }
  .genest-add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; }
  .genest-add-form input { flex: 1; min-width: 120px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px;
    padding: 9px 12px; font-family: inherit; font-size: 16px; color: var(--ink); }
  .genest-add-form select.sort-select { flex: 1; min-width: 140px; }
  .add-confirm { flex: 1 1 100%; margin: 0; font-size: 0.86rem; color: var(--accent); animation: add-confirm-fade 2.2s ease forwards; }
  @keyframes add-confirm-fade { 0% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  .isbn-preview { display: flex; gap: 12px; align-items: center; width: 100%; }
  .isbn-preview img { width: 48px; height: 68px; object-fit: cover; border-radius: 4px; background: var(--surface-2); flex-shrink: 0; }
  .isbn-preview-text { flex: 1; min-width: 100px; }
  .isbn-preview-text strong { display: block; }
  .isbn-preview-text span { color: var(--muted); font-size: 0.85rem; }
  .isbn-msg { width: 100%; color: var(--muted); font-size: 0.84rem; font-style: italic; margin: 0; }
  .isbn-msg.error { color: var(--danger); font-style: normal; }

  .items-scroll { overflow-x: auto; margin: 0 0 18px; -webkit-overflow-scrolling: touch; }
  .items-table { border-collapse: collapse; width: 100%; }
  .items-table thead th {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); font-weight: 600;
    text-align: center; padding: 0 4px 8px; border-bottom: 1px solid var(--border); white-space: normal; line-height: 1.15;
  }
  .items-table tbody tr { border-bottom: 1px solid var(--border); }
  .items-table tbody tr:last-child { border-bottom: none; }
  .items-table td { padding: 8px 4px; vertical-align: middle; }
  .col-title { position: sticky; left: 0; background: var(--surface); z-index: 2; text-align: left; min-width: 160px; max-width: 280px; padding-left: 2px !important; }
  .edit-row-cell { text-align: left; }
  .col-title-head { z-index: 3; }
  .col-actions { position: sticky; right: 0; background: var(--surface); z-index: 2; white-space: nowrap; width: 1%; }
  .col-actions-head { z-index: 3; }
  /* Op telefoonbreedte samen sticky titelkolom (~160px) + sticky actiekolom (~90-120px, groeit met
     het aantal icoontjes) al bijna of helemaal de volledige schermbreedte op — er blijft dan geen
     (of een paar pixels) scrollruimte over waarin de vinkjeskolommen ertussenin ooit zichtbaar
     kunnen worden, hoe ver je ook scrolt (ze zitten permanent "onder" een van beide sticky kolommen
     verstopt). Gemeten op 375px: titel 160px + acties 122px = 282px, dus nog maar 3px vrij op een
     scherm van 285px binnenwerk — vinkjes (LP/CD/In bezit e.d.) dus nooit bereikbaar. Fix: op smalle
     schermen de actiekolom niet sticky maken (gewoon laten meescrollen als laatste kolom) — dan is
     er nog maar ÉÉN sticky kolom (titel), en scrollen werkt weer normaal om de vinkjes te bereiken.
     Bewerken blijft zonder scrollen mogelijk via een tik op de titel zelf. */
  @media (max-width: 480px) {
    .col-actions { position: static; }
  }
  .col-check { text-align: center; width: 54px; min-width: 54px; }

      .trim().replace(/\s+/g, ' ');
  }
  function findReeksByNaam(entry, naam) {
    var norm = normalizeReeksNaam(naam);
    if (!norm) return null;
    return reeksenFor(entry.id).find(function (r) { return normalizeReeksNaam(r.naam) === norm; }) || null;
  }
  function addReeks(entry, naam) {
    return supabase.from('reeksen').insert({ lijst_id: entry.id, naam: naam, volgorde: Date.now() }).select().single();
  }
  // Vindt een bestaande reeks op een genormaliseerde naam (spatie/hoofdletter-/&-vs-en-ongevoelig,
  // bv. "Suske en Wiske" == "Suske & Wiske") of maakt er stilzwijgend een nieuwe van — voorkomt dat
  // de gebruiker expliciet moet kiezen/weten of een auteur/artiest/reeks al bestaat.
  async function findOrCreateReeks(entry, naam) {
    var existing = findReeksByNaam(entry, naam);
    if (existing) return { data: existing, error: null };
    return addReeks(entry, naam);
  }
  function renameReeks(reeks, naam) {
    if (!naam || naam === reeks.naam) return;
    supabase.from('reeksen').update({ naam: naam }).eq('id', reeks.id).then(refetchSoft);
  }
  function deleteReeks(reeks) {
    if (!window.confirm('Reeks "' + reeks.naam + '" verwijderen? Alle albums in deze reeks worden ook verwijderd. Dit kan niet ongedaan gemaakt worden.')) return;
    supabase.from('reeksen').delete().eq('id', reeks.id).then(refetchSoft);
  }
  function moveReeks(list, reeks, dir) {
    var idx = list.findIndex(function (r) { return r.id === reeks.id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= list.length) return;
    var a = list[idx], b = list[swapIdx];
    Promise.all([
      supabase.from('reeksen').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('reeksen').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  // ---------- Boek toevoegen op ISBN (Open Library) ----------
  function newIsbnLookupState() {
    return { step: 'input', isbn: '', loading: false, error: '', book: null, reeksId: '', newReeksNaam: '' };
  }

  async function isbnSearch(entry) {
    var lk = state.isbnLookup[entry.id];
    var isbn = (lk.isbn || '').replace(/[^0-9Xx]/g, '');
    if (!isbn) { lk.error = 'Vul een ISBN in.'; renderDetail(); return; }
    var existing = itemsFor(entry.id).find(function (i) { return i.extern_id === isbn; });
    if (existing) { lk.error = 'Dit ISBN staat al in de lijst ("' + existing.titel + '").'; renderDetail(); return; }
    lk.loading = true; lk.error = ''; renderDetail();
    try {
      var res = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + encodeURIComponent(isbn) + '&jscmd=data&format=json');
      var data = await res.json();
      var rec = data['ISBN:' + isbn];
      if (!rec) { lk.error = 'Geen boek gevonden voor dit ISBN.'; return; }
      var author = (rec.authors && rec.authors[0] && rec.authors[0].name) || '';
      var matched = author ? findReeksByNaam(entry, author) : null;
      var yearMatch = (rec.publish_date || '').match(/\d{4}/);
      lk.book = {
        isbn: isbn, title: rec.title || '(onbekende titel)', author: author,
        cover: (rec.cover && (rec.cover.medium || rec.cover.large || rec.cover.small)) || null,
        year: yearMatch ? yearMatch[0] : null
      };
      lk.reeksId = matched ? String(matched.id) : '__new__';
      lk.newReeksNaam = author;
      lk.step = 'result';
    } catch (e) {
      console.error('isbn lookup failed', e);
      lk.error = 'Opzoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      lk.loading = false; renderDetail();
    }
  }

  async function isbnCommit(entry) {
    var lk = state.isbnLookup[entry.id];
    var book = lk.book;
    var reeksId = lk.reeksId;
    if (reeksId === '__new__') {
      var naam = (lk.newReeksNaam || '').trim();
      if (!naam) return;
      var reeksRes = await addReeks(entry, naam);
      if (reeksRes.error || !reeksRes.data) { console.error(reeksRes.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      reeksId = reeksRes.data.id;
    }
    var vinkjes = {};
    (entry.vink_velden || []).forEach(function (vk) { vinkjes[vk.key] = false; });
    var extra = {};
    if (book.year && (entry.extra_velden || []).some(function (f) { return f.key === 'jaar'; })) extra.jaar = book.year;
    var result = await supabase.from('lijst_items').insert({
      lijst_id: entry.id, titel: book.title, extra: extra, vinkjes: vinkjes, reeks_id: reeksId,
      bron: 'openlibrary', extern_id: book.isbn, omslag_url: book.cover || null, volgorde: Date.now()
    });
    delete state.isbnLookup[entry.id];
    refetchSoft(result);
  }

      var titleTd = document.createElement('td');

      if (manualOrder) {

        upBtn.addEventListener('click', function () { moveItem(orderItems, item, -1); });

        trackSearchBtn.title = 'Tracklist ophalen (Discogs)'; trackSearchBtn.setAttribute('aria-label', 'Tracklist ophalen via Discogs');
        trackSearchBtn.addEventListener('click', function () { openTrackSearch(item); });
        itemActions.appendChild(trackSearchBtn);

      editBtn.addEventListener('click', function () { state.editingItem = item.id; renderDetail(); resetItemsScroll(); });

    function buildReeksHeaderRow(reeks, ridx, reeksen, groupFull, collapsed) {

    function renderNestedItems(filtered, fullItemsAll) {
      var reeksSortActive = currentSortKey(entry) === 'reeks';
      var reeksen = reeksenFor(entry.id);
      if (reeksSortActive) {
        reeksen = reeksen.slice().sort(function (a, b) { return (a.naam || '').localeCompare(b.naam || '', 'nl', { sensitivity: 'base' }); });
      }

      if (!reeksen.length) {
        var noReeksP = document.createElement('p'); noReeksP.className = 'items-empty';
        // Tekst hangt af van het actieve tabblad — het toevoegformulier staat alleen boven de tabel
        // als je al op "Toevoegen" staat; in "Bekijken" bestaat er geen "knop hieronder" en was de
        // oude, vaste tekst dus misleidend.
        noReeksP.textContent = viewMode === 'toevoegen'
          ? 'Nog niets toegevoegd. Gebruik het formulier hierboven om te beginnen.'
          : 'Nog niets toegevoegd. Ga naar het tabblad "Toevoegen" hierboven om te beginnen.';
        dbody.appendChild(noReeksP);
        return;
      }

      var hasActiveQuery = !!(state.search[entry.id] || '').trim() || hasActiveFilter(entry);
      var shell = buildTableShell();
      var tbody = document.createElement('tbody');

      reeksen.forEach(function (reeks, ridx) {
        var groupItems = filtered.filter(function (i) { return i.reeks_id === reeks.id; });
        if (hasActiveQuery && !groupItems.length) return;
        var groupFull = fullItemsAll.filter(function (i) { return i.reeks_id === reeks.id; });
        var collapsed = !!state.collapsedReeks[reeks.id] && !hasActiveQuery;

        tbody.appendChild(buildReeksHeaderRow(reeks, ridx, reeksen, groupFull, collapsed));

        if (state.importFlow && state.importFlow.listId === entry.id && state.importFlow.reeksId === reeks.id) {
          openImportReeks = reeks;
          var impRow = document.createElement('tr'); impRow.className = 'reeks-row';
          var impTd = document.createElement('td'); impTd.colSpan = colCount;
          impTd.appendChild(buildImportPanel(entry));
          impRow.appendChild(impTd);
          tbody.appendChild(impRow);
        }

        if (!collapsed) {
          if (!groupItems.length) {
            var gEmptyRow = document.createElement('tr');
            var gEmptyTd = document.createElement('td');
            gEmptyTd.colSpan = colCount; gEmptyTd.className = 'items-empty';
            gEmptyTd.textContent = groupFull.length ? 'Geen items met dit filter.' : 'Nog geen items in deze reeks.';
            gEmptyRow.appendChild(gEmptyTd); tbody.appendChild(gEmptyRow);
          } else {
            groupItems.forEach(function (item) { tbody.appendChild(buildItemRow(item, groupFull)); });
          }
        }
      });

      var orphanItems = filtered.filter(function (i) { return !i.reeks_id; });
      if (orphanItems.length) {
        var orphanFull = fullItemsAll.filter(function (i) { return !i.reeks_id; });
        var oHeadRow = document.createElement('tr'); oHeadRow.className = 'reeks-row';
        var oHeadTd = document.createElement('td'); oHeadTd.colSpan = colCount;
        var oLabel = document.createElement('span'); oLabel.className = 'reeks-label-plain'; oLabel.textContent = 'Zonder reeks';
        oHeadTd.appendChild(oLabel); oHeadRow.appendChild(oHeadTd); tbody.appendChild(oHeadRow);
        orphanItems.forEach(function (item) { tbody.appendChild(buildItemRow(item, orphanFull)); });
      }

      shell.table.appendChild(tbody);
      dbody.appendChild(shell.scrollWrap);
    }

    if (entry.genest) {
      if (viewMode === 'toevoegen') {
        var addRow = document.createElement('div'); addRow.className = 'genest-add-row';
        addRow.appendChild(buildGenestAddForm(entry));
        if (entry.auto_import === 'openlibrary') addRow.appendChild(buildIsbnAddForm(entry));
        dbody.appendChild(addRow);
      }
      renderNestedItems(items, fullItems);
    } else {
      if (viewMode === 'toevoegen') dbody.appendChild(buildAddItemForm(entry));
      var emptyMsg = fullItems.length ? 'Geen items met dit filter.' : (viewMode === 'toevoegen'
        ? 'Nog geen items op dit lijstje. Gebruik het formulier hierboven.'
        : 'Nog geen items op dit lijstje. Ga naar het tabblad "Toevoegen" hierboven om te beginnen.');
      dbody.appendChild(buildItemsTable(items, fullItems, emptyMsg));
    }


    detailCardEl.appendChild(dbody);
    applyWideRowContentWidths();

    if (restoreSearchFocus !== null) {
      var searchInputEl = detailCardEl.querySelector('.search-input');
      if (searchInputEl) { searchInputEl.focus(); searchInputEl.setSelectionRange(restoreSearchFocus, restoreSearchFocus); }
    }
  }

  // `calc(100vw - Npx)` in de `.wide-row-content`-CSS is een redelijke schatting, maar iOS Safari
  // berekent `100vw` niet altijd gelijk aan de echte zichtbare breedte (bekende platform-quirk) —
  // vandaar dit na elke render overschrijven met een gemeten waarde (de scroll-container kent zijn
  // eigen breedte altijd correct, ongeacht dat soort viewport-verschillen).
  function applyWideRowContentWidths() {
    var scrollWrap = detailCardEl.querySelector('.items-scroll');
    if (!scrollWrap || !scrollWrap.clientWidth) return;
    var w = scrollWrap.clientWidth + 'px';
    detailCardEl.querySelectorAll('.wide-row-content').forEach(function (el) { el.style.maxWidth = w; });
  }
  // `position:sticky` op een element BINNEN een `<td>` (i.p.v. op de `<td>` zelf) staat bekend om
  // wisselend gedrag op WebKit/iOS — als die sticky-positionering daar niet aanslaat, blijft een
  // colSpan-rij (bewerkform, cover-/tracklist-zoekpaneel) toch op zijn "natuurlijke" plek in de
  // brede tabel staan i.p.v. mee te schuiven naar de zichtbare linkerrand. Reset daarom de
  // scrollpositie van de tabel expliciet bij het OPENEN van zo'n rij (niet bij elke render) —
  // zo hangt zichtbaarheid niet af van of sticky het daar wel/niet doet.
  function resetItemsScroll() {
    var scrollWrap = detailCardEl.querySelector('.items-scroll');
    if (scrollWrap) scrollWrap.scrollLeft = 0;
  }

  // ---------- Modus-tabs: Zoeken / Bekijken / Toevoegen ----------
  // Bewust gescheiden i.p.v. altijd alles tegelijk tonen: zoeken, filteren/sorteren en toevoegen
  // zijn losse activiteiten die elkaar in de weg zitten als ze allemaal tegelijk in beeld staan
  // (concrete klacht: "als ik zoek ben ik niet aan het toevoegen"). Wisselen kan altijd via de tabs.
  function setViewMode(entry, mode) {
    var prev = state.viewMode[entry.id] || 'bekijken';
    if (prev === mode) return;
    if (prev === 'toevoegen') {
      delete state.isbnLookup[entry.id];
      if (state.importFlow && state.importFlow.listId === entry.id) state.importFlow = null;
    }
    state.viewMode[entry.id] = mode;
    renderDetail();
  }

  function renderModeTabs(entry) {
    var wrap = document.createElement('div'); wrap.className = 'mode-tabs';
    var current = state.viewMode[entry.id] || 'bekijken';
    [['bekijken', 'Bekijken'], ['toevoegen', 'Toevoegen']].forEach(function (pair) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'mode-tab-btn' + (current === pair[0] ? ' active' : '');
      btn.textContent = pair[1];
      btn.addEventListener('click', function () { setViewMode(entry, pair[0]); });
      wrap.appendChild(btn);

    return wrap;

  // ---------- Fields editor ----------
  function renderFieldsEditor(entry) {
    var box = document.createElement('div');
    box.className = 'fields-editor';

    function persist(patch) { supabase.from('lijsten').update(patch).eq('id', entry.id).then(refetchSoft); }

    var descGroup = document.createElement('div');
    descGroup.className = 'fields-editor-group';
    var descH4 = document.createElement('h4'); descH4.textContent = 'Omschrijving';
    descGroup.appendChild(descH4);
    var descArea = document.createElement('textarea');
    descArea.className = 'fields-editor-desc'; descArea.rows = 2;
    descArea.placeholder = 'Voeg een omschrijving toe…';
    descArea.value = entry.omschrijving || '';
    descArea.addEventListener('blur', function () {
      var v = descArea.value.trim();
      if (v !== (entry.omschrijving || '')) persist({ omschrijving: v || null });
    });
    descGroup.appendChild(descArea);
    box.appendChild(descGroup);

    function buildGroup(title, arr, cap, kindLabel, onAdd) {
      var group = document.createElement('div');
      group.className = 'fields-editor-group';
      var h4 = document.createElement('h4'); h4.textContent = title;
      group.appendChild(h4);
      arr.forEach(function (f, i) {
        var row = document.createElement('div'); row.className = 'fields-editor-row';
        var inp = document.createElement('input'); inp.value = f.label;
        inp.addEventListener('blur', function () {
          var v = inp.value.trim();
          if (!v || v === f.label) { inp.value = f.label; return; }
          var copy = arr.slice(); copy[i] = { key: f.key, label: v };
          persist(kindLabel === 'extra' ? { extra_velden: copy } : { vink_velden: copy });
        });
        var del = document.createElement('button');
        del.type = 'button'; del.className = 'icon-btn danger'; del.innerHTML = '&#10005;';
        del.setAttribute('aria-label', 'Verwijder veld ' + f.label);
        del.addEventListener('click', function () {
          var copy = arr.slice(); copy.splice(i, 1);
          persist(kindLabel === 'extra' ? { extra_velden: copy } : { vink_velden: copy });
        });
        row.appendChild(inp); row.appendChild(del);
        group.appendChild(row);
      });
      var addBtn = document.createElement('button');
      addBtn.type = 'button'; addBtn.className = 'link-btn';
      addBtn.textContent = kindLabel === 'extra' ? '+ tekstveld toevoegen' : '+ vinkje toevoegen';
      addBtn.disabled = arr.length >= cap;
      addBtn.addEventListener('click', onAdd);
      group.appendChild(addBtn);
      return group;
    }

    if (entry.auto_import === 'discogs') {
      var sourceGroup = document.createElement('div'); sourceGroup.className = 'fields-editor-group';
      var sh4 = document.createElement('h4'); sh4.textContent = 'Discogs';
      sourceGroup.appendChild(sh4);
      var userRow = document.createElement('div'); userRow.className = 'field-row';
      var userLabel = document.createElement('label'); userLabel.textContent = 'Discogs-gebruikersnaam';
      var userInput = document.createElement('input');
      userInput.value = entry.discogs_username || ''; userInput.placeholder = 'Bijv. bertellen';
      userInput.addEventListener('blur', function () {
        var v = userInput.value.trim();
        if (v === (entry.discogs_username || '')) return;
        persist({ discogs_username: v || null });
      });
      userRow.appendChild(userLabel); userRow.appendChild(userInput);
      sourceGroup.appendChild(userRow);
      box.appendChild(sourceGroup);
    }

    box.appendChild(buildGroup('Tekstvelden', entry.extra_velden || [], FIELD_CAP.extra, 'extra', function () {
      var arr = entry.extra_velden || [];
      var key = uniqueKey(slugify('Nieuw veld'), arr.map(function (f) { return f.key; }));
      persist({ extra_velden: arr.concat([{ key: key, label: 'Nieuw veld' }]) });
    }));
    box.appendChild(buildGroup('Vinkjes', entry.vink_velden || [], FIELD_CAP.vink, 'vink', function () {
      var arr = entry.vink_velden || [];
      var key = uniqueKey(slugify('Nieuw vinkje'), arr.map(function (f) { return f.key; }));
      persist({ vink_velden: arr.concat([{ key: key, label: 'Nieuw vinkje' }]) });
    }));
    return box;
  }

    var customTypeLabel = document.createElement('label'); customTypeLabel.textContent = 'Type naam';

    var nameRow = document.createElement('div'); nameRow.className = 'field-row';
    var nameLabel = document.createElement('label'); nameLabel.textContent = 'Naam';
    var nameInput = document.createElement('input'); nameInput.placeholder = 'Bijv. Te lezen boeken';
    nameRow.appendChild(nameLabel); nameRow.appendChild(nameInput);
    card.appendChild(nameRow);

    var descRow = document.createElement('div'); descRow.className = 'field-row';
    var descLabel = document.createElement('label'); descLabel.textContent = 'Omschrijving (optioneel)';
    var descInput = document.createElement('textarea'); descInput.rows = 2; descInput.placeholder = 'Waar gaat dit lijstje over?';
    descRow.appendChild(descLabel); descRow.appendChild(descInput);
    card.appendChild(descRow);

    var actions = document.createElement('div'); actions.className = 'ghost-actions';
    var cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'btn-text'; cancel.textContent = 'Annuleren';
    cancel.addEventListener('click', function () { card.remove(); });
    var confirm = document.createElement('button');
    confirm.type = 'button'; confirm.className = 'btn-primary'; confirm.textContent = 'Aanmaken';
    function submit() {
      var v = nameInput.value.trim();
      if (!v) { nameInput.focus(); return; }
      var preset = PRESETS[selectedTpl];
      var typeLabel = selectedTpl === 'aangepast' ? (customTypeInput.value.trim() || 'Aangepast') : preset.type_label;
      supabase.from('lijsten').insert({
        naam: v, omschrijving: descInput.value.trim() || null, type_label: typeLabel,
        auto_import: preset.auto_import, extra_velden: preset.extra_velden, vink_velden: preset.vink_velden, doorstrepen: preset.doorstrepen,
        genest: preset.genest || false, volgorde: Date.now()
      }).then(refetchSoft);
      card.remove();
    }
    confirm.addEventListener('click', submit);
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } if (e.key === 'Escape') card.remove(); });
    actions.appendChild(cancel); actions.appendChild(confirm);
    card.appendChild(actions);

    gridEl.insertBefore(card, gridEl.firstChild);
    nameInput.focus();
  }

  function deleteList(id, name) {
    if (!window.confirm('Lijstje "' + name + '" verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
    if (state.currentId === id) goHome();
    supabase.from('lijsten').delete().eq('id', id).then(refetchSoft);
  }

  function moveList(id, dir) {
    var lists = sortedLists();
    var idx = lists.findIndex(function (l) { return l.id === id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= lists.length) return;
    var a = lists[idx], b = lists[swapIdx];
    Promise.all([
      supabase.from('lijsten').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijsten').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  function moveItem(items, item, dir) {
    var idx = items.findIndex(function (i) { return i.id === item.id; });
    var swapIdx = idx + dir;
    if (idx < 0 || swapIdx < 0 || swapIdx >= items.length) return;
    var a = items[idx], b = items[swapIdx];
    Promise.all([
      supabase.from('lijst_items').update({ volgorde: b.volgorde }).eq('id', a.id),
      supabase.from('lijst_items').update({ volgorde: a.volgorde }).eq('id', b.id)
    ]).then(refetchSoft);
  }

  async function uploadCover(listId, file, triggerBtn) {
    var originalText = triggerBtn.textContent;
    triggerBtn.textContent = 'Bezig…'; triggerBtn.disabled = true;
    try {
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      var path = COVER_PREFIX + listId + '-' + Date.now() + '.' + ext;
      var upload = await supabase.storage.from(COVER_BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
      if (upload.error) throw upload.error;
      var pub = supabase.storage.from(COVER_BUCKET).getPublicUrl(path);
      await supabase.from('lijsten').update({ omslag_url: pub.data.publicUrl }).eq('id', listId);
      await refetchAll();
    } catch (e) {
      console.error('cover upload failed', e);
      window.alert('Uploaden van de foto is niet gelukt.');
    } finally {
      triggerBtn.textContent = originalText; triggerBtn.disabled = false;
    }
  }
  function removeCover(listId) {
    if (!window.confirm('Foto verwijderen?')) return;
    supabase.from('lijsten').update({ omslag_url: null }).eq('id', listId).then(refetchSoft);
  }

  async function uploadItemCover(item, file) {

      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      var path = COVER_PREFIX + 'item-' + item.id + '-' + Date.now() + '.' + ext;
      var upload = await supabase.storage.from(COVER_BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' });
      if (upload.error) throw upload.error;
      var pub = supabase.storage.from(COVER_BUCKET).getPublicUrl(path);
      await supabase.from('lijst_items').update({ omslag_url: pub.data.publicUrl }).eq('id', item.id);
      await refetchAll();
    } catch (e) {
      console.error('item cover upload failed', e);
      window.alert('Uploaden van de foto is niet gelukt.');
    }
  }

  // ---------- Cover ophalen (Open Library) voor handmatig toegevoegde boeken ----------
  function openCoverSearch(item, entry) {
    state.editingItem = null;
    state.coverSearch = { itemId: item.id, loading: true, error: '', results: [] };
    renderDetail();
    resetItemsScroll();
    runCoverSearch(item, entry);
  }
  function closeCoverSearch() { state.coverSearch = null; renderDetail(); }

  async function runCoverSearch(item, entry) {
    var cs = state.coverSearch;
    var authorKey = entry.extra_velden && entry.extra_velden[0] ? entry.extra_velden[0].key : null;
    var author = (authorKey && item.extra && item.extra[authorKey]) || '';
    try {
      var mainTitle = (item.titel || '').split(' - ')[0];
      var q = (mainTitle + ' ' + author).trim();
      var url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(q)
        + '&fields=key,title,author_name,cover_i&limit=8';
      var res = await fetch(url);
      var data = await res.json();
      var seen = {};
      cs.results = (data.docs || []).filter(function (d) { return d.cover_i; }).filter(function (d) {
        if (seen[d.cover_i]) return false;
        seen[d.cover_i] = true;
        return true;
      }).slice(0, 6).map(function (d) {
        return {
          id: d.key, title: d.title, author: (d.author_name || [])[0] || '',
          coverUrl: 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-M.jpg'
        };
      });
      if (!cs.results.length) cs.error = 'Geen cover gevonden voor "' + (item.titel || '') + '".';
    } catch (e) {
      console.error('cover search failed', e);
      cs.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      cs.loading = false; renderDetail();
    }
  }

  async function applyCoverSearchResult(item, coverUrl) {
    state.coverSearch = null;
    renderDetail();
    await supabase.from('lijst_items').update({ omslag_url: coverUrl }).eq('id', item.id);
    await refetchAll();
  }

  newListBtn.addEventListener('click', showNewListForm);

  // ---------- Auto-import (Open Library / Discogs) ----------
  function openImportFlow(entry, reeks, sourceOverride) {
    var source = sourceOverride || entry.auto_import;
    state.importFlow = {
      listId: entry.id, reeksId: reeks ? reeks.id : null, source: source, step: 'search', query: reeks ? reeks.naam : '',
      candidates: [], candidateName: '', candidateId: '', works: [], selected: new Set(),
      loading: false, error: '', note: ''
    };
    if (source === 'discogs') {
      state.importFlow.step = 'works';
      state.importFlow.loading = true;
      runDiscogsFetch(entry);
      renderDetail();
    } else if (reeks) {
      importSearch(reeks.naam);
    } else {
      renderDetail();
    }
    // Zelfde iOS-scroll-reset als bij het openen van een bewerkformulier/cover-/tracklist-zoeken —
    // dit paneel is ook een wide-row-content-rij en hoort dezelfde bescherming te krijgen (was
    // eerder gemist; ontdekt bij het toevoegen van de wide-row-content-klasse aan buildImportPanel).
    resetItemsScroll();
  }
  function closeImportFlow() { state.importFlow = null; renderDetail(); }

  async function runDiscogsFetch(entry) {
    var flow = state.importFlow;
    try {
      var username = entry.discogs_username;
      var page = 1, perPage = 100, all = [];
      while (true) {
        var res = await fetch('https://api.discogs.com/users/' + encodeURIComponent(username) + '/collection/folders/0/releases?per_page=' + perPage + '&page=' + page);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        all = all.concat(data.releases || []);
        var pages = (data.pagination && data.pagination.pages) || 1;
        if (page >= pages || !data.releases || !data.releases.length) break;
        page++;
      }
      var seen = {};
      flow.works = all.filter(function (r) {
        if (seen[r.id]) return false;
        seen[r.id] = true; return true;
      }).map(function (r) {
        var bi = r.basic_information || {};
        return {
          id: String(r.id), title: bi.title || '(onbekende titel)',
          artist: (bi.artists && bi.artists[0] && bi.artists[0].name) || '',
          coverUrl: bi.cover_image || null, year: bi.year || null,
          formats: (bi.formats || []).map(function (f) { return f.name; })
        };
      });
      flow.works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      flow.selected = new Set(flow.works.map(function (w) { return w.id; }));
      if (!flow.works.length) flow.error = 'Geen items gevonden in je Discogs-collectie.';
    } catch (e) {
      console.error('discogs import failed', e);
      flow.error = 'Ophalen van je Discogs-collectie is niet gelukt. Klopt de gebruikersnaam en staat de collectie op publiek?';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  async function importSearch(query) {
    var flow = state.importFlow;
    flow.query = query; flow.loading = true; flow.error = ''; renderDetail();
    try {
      var res = await fetch('https://openlibrary.org/search/authors.json?q=' + encodeURIComponent(query));
      var data = await res.json();
      flow.candidates = (data.docs || []).slice(0, 8).map(function (d) {
        return { id: d.key, name: d.name, meta: [d.birth_date, d.work_count ? (d.work_count + ' werken') : null].filter(Boolean).join(' · ') };
      });
      flow.step = 'candidates';
      if (!flow.candidates.length) flow.error = 'Geen resultaten voor "' + query + '".';
    } catch (e) {
      console.error('import search failed', e);
      flow.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  async function importPickCandidate(cand) {
    var flow = state.importFlow;
    flow.candidateName = cand.name; flow.candidateId = cand.id;
    flow.loading = true; flow.error = ''; flow.note = ''; renderDetail();
    try {
      var works = [];
      var q = 'author_key:' + cand.id + ' AND language:dut';
      var res = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q)
        + '&editions.language=dut&limit=300&fields=key,title,cover_i,first_publish_year,editions,editions.title,editions.cover_i');
      var data = await res.json();
      var seen = {};
      (data.docs || []).forEach(function (w) {
        var ed = w.editions && w.editions.docs && w.editions.docs[0];
        var title = (ed && ed.title) || w.title;
        var coverId = (ed && ed.cover_i) || w.cover_i;
        var norm = (title || '').trim().toLowerCase();
        if (!norm || seen[norm]) return;
        seen[norm] = true;
        works.push({ id: w.key, title: title, coverUrl: coverId ? ('https://covers.openlibrary.org/b/id/' + coverId + '-M.jpg') : null, year: w.first_publish_year || null });
      });
      if (!works.length) {
        // Sommige titels missen taalmetadata in Open Library, ook als het werk zelf al een
        // Nederlandse (vertaal)titel heeft (vaak bij recentere/kinderboeken) — val dan terug
        // op alle werken van de auteur i.p.v. niets te tonen.
        var res3 = await fetch('https://openlibrary.org/search.json?author_key=' + encodeURIComponent(cand.id) + '&limit=300&fields=key,title,cover_i,first_publish_year');
        var data3 = await res3.json();
        (data3.docs || []).forEach(function (w) {
          var norm = (w.title || '').trim().toLowerCase();
          if (!norm || seen[norm]) return;
          seen[norm] = true;
          works.push({ id: w.key, title: w.title, coverUrl: w.cover_i ? ('https://covers.openlibrary.org/b/id/' + w.cover_i + '-M.jpg') : null, year: w.first_publish_year || null });
        });
        if (works.length) flow.note = 'Geen titels met Nederlandse taalmarkering gevonden bij Open Library — onderstaande titels zijn mogelijk niet in het Nederlands.';
      }
      works.sort(function (a, b) { return a.title.localeCompare(b.title); });
      flow.works = works;
      flow.selected = new Set();
      flow.step = 'works';
      if (!works.length) flow.error = 'Geen titels gevonden.';
    } catch (e) {
      console.error('import fetch works failed', e);
      flow.error = 'Ophalen is niet gelukt. Probeer het later opnieuw.';
    } finally {
      flow.loading = false; renderDetail();
    }
  }

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  async function fetchDiscogsReleaseDetail(releaseId) {
    try {
      var res = await fetch('https://api.discogs.com/releases/' + encodeURIComponent(releaseId));
      if (!res.ok) return null;
      var data = await res.json();
      var list = data.tracklist || [];
      var tracklist = list.length ? list.map(function (t) {
        var pos = t.position ? t.position + '. ' : '';
        var dur = t.duration ? ' (' + t.duration + ')' : '';
        return (pos + (t.title || '') + dur).trim();
      }).filter(Boolean).join('\n') : null;
      var img = data.images && data.images.length ? (data.images[0].uri || data.images[0].resource_url) : null;
      return { tracklist: tracklist, coverUrl: img || null };
    } catch (e) {
      console.error('discogs release detail fetch failed', e);
      return null;
    }
  }
  async function fetchDiscogsTracklist(releaseId) {
    var detail = await fetchDiscogsReleaseDetail(releaseId);
    return detail ? detail.tracklist : null;
  }

  // ---------- Tracklist ophalen via Discogs (los, per item zonder tracklist) ----------
  function openTrackSearch(item) {
    state.trackSearch = { itemId: item.id, step: 'candidates', loading: true, error: '', candidates: [], picked: null };
    renderDetail();
    resetItemsScroll();
    runTrackSearch(item);
  }
  function closeTrackSearch() { state.trackSearch = null; renderDetail(); }

  async function runTrackSearch(item) {
    var ts = state.trackSearch;
    try {
      var rk = item.reeks_id ? state.reeksen.find(function (r) { return r.id === item.reeks_id; }) : null;
      var artist = rk ? rk.naam : '';
      var lp = !!(item.vinkjes && item.vinkjes.lp), cd = !!(item.vinkjes && item.vinkjes.cd);
      var formatParam = (lp && !cd) ? 'Vinyl' : ((cd && !lp) ? 'CD' : '');
      var url = 'https://api.discogs.com/database/search?type=release'
        + '&artist=' + encodeURIComponent(artist)
        + '&release_title=' + encodeURIComponent(item.titel || '')
        + (formatParam ? '&format=' + encodeURIComponent(formatParam) : '')
        + '&per_page=20';
      var res = await fetch(url);
      var data = await res.json();
      if (data.message) throw new Error(data.message);
      ts.candidates = (data.results || []).map(function (r) {
        return { id: r.id, title: r.title || '', year: r.year || null, formats: r.format || [] };
      });
      if (!ts.candidates.length) ts.error = 'Geen releases gevonden op Discogs voor "' + (item.titel || '') + '".';
    } catch (e) {
      console.error('discogs track search failed', e);
      ts.error = 'Zoeken is niet gelukt. Probeer het later opnieuw.';
    } finally {
      ts.loading = false; renderDetail();
    }
  }

  async function pickTrackCandidate(cand) {
    var ts = state.trackSearch;
    ts.loading = true; ts.error = ''; renderDetail();
    try {
      var detail = await fetchDiscogsReleaseDetail(cand.id);
      if (!detail || !detail.tracklist) {
        ts.error = 'Geen tracklist gevonden voor deze release. Probeer een andere.';
        ts.loading = false; renderDetail();
        return;
      }
      ts.picked = { id: cand.id, title: cand.title, year: cand.year, tracklist: detail.tracklist, coverUrl: detail.coverUrl };
      ts.step = 'confirm';
    } catch (e) {
      console.error('discogs release detail failed', e);
      ts.error = 'Ophalen is niet gelukt. Probeer het later opnieuw.';
    } finally {
      ts.loading = false; renderDetail();
    }
  }

  async function confirmTrackPick(item) {
    var ts = state.trackSearch;
    var picked = ts.picked;
    if (!picked) return;
    var patch = { tracklist: picked.tracklist };
    if (!item.omslag_url && picked.coverUrl) patch.omslag_url = picked.coverUrl;
    state.trackSearch = null;
    var result = await supabase.from('lijst_items').update(patch).eq('id', item.id);
    refetchSoft(result);
  }

  async function importCommit(entry) {
    var flow = state.importFlow;
    var existingExternIds = {};
    itemsFor(entry.id).forEach(function (i) { if (i.extern_id) existingExternIds[i.extern_id] = true; });
    var extraKey = entry.extra_velden && entry.extra_velden[0] ? entry.extra_velden[0].key : null;
    var base = Date.now();
    var selectedWorks = flow.works.filter(function (w) { return flow.selected.has(w.id) && !existingExternIds[w.id]; });
    closeImportFlow();
    if (!selectedWorks.length) return;

    var reeksByName = {};
    var singleReeksId = null;
    if (entry.genest && !flow.reeksId && flow.source === 'discogs') {
      reeksenFor(entry.id).forEach(function (r) { reeksByName[normalizeReeksNaam(r.naam)] = r; });
      var neededNames = {};
      selectedWorks.forEach(function (w) {
        var n = (w.artist || '').trim();
        var norm = normalizeReeksNaam(n);
        if (n && norm && !reeksByName[norm] && !neededNames[norm]) neededNames[norm] = n;
      });
      var toCreate = Object.keys(neededNames).map(function (k) { return neededNames[k]; });
      if (toCreate.length) {
        var newReeksRows = toCreate.map(function (naam, i) { return { lijst_id: entry.id, naam: naam, volgorde: base + i }; });
        var reeksInsertRes = await supabase.from('reeksen').insert(newReeksRows).select();
        (reeksInsertRes.data || []).forEach(function (r) { reeksByName[normalizeReeksNaam(r.naam)] = r; });
      }
    } else if (entry.genest && !flow.reeksId && flow.candidateName) {
      var reeksRes2 = await findOrCreateReeks(entry, flow.candidateName);
      if (reeksRes2.error || !reeksRes2.data) { console.error(reeksRes2.error); window.alert('Er ging iets mis bij het opslaan.'); return; }
      singleReeksId = reeksRes2.data.id;
    }

    var jaarKey = (entry.extra_velden || []).some(function (f) { return f.key === 'jaar'; }) ? 'jaar' : null;
    var rows = [];
    for (var wi = 0; wi < selectedWorks.length; wi++) {
      var w = selectedWorks[wi];
      var extra = {};
      if (entry.genest) {
        if (jaarKey && w.year) extra[jaarKey] = String(w.year);
      } else if (extraKey) {
        extra[extraKey] = flow.source === 'discogs' ? (w.artist || '') : flow.candidateName;
      }
      var vinkjes = {};
      (entry.vink_velden || []).forEach(function (vk) { vinkjes[vk.key] = false; });
      var tracklist = null;
      if (flow.source === 'discogs') {
        if (vinkjes.hasOwnProperty('in_bezit')) vinkjes.in_bezit = true;
        var fmts = w.formats || [];
        if (vinkjes.hasOwnProperty('lp') && fmts.indexOf('Vinyl') !== -1) vinkjes.lp = true;
        if (vinkjes.hasOwnProperty('cd') && fmts.indexOf('CD') !== -1) vinkjes.cd = true;
        tracklist = await fetchDiscogsTracklist(w.id);
        if (wi < selectedWorks.length - 1) await sleep(300);
      }
      var row = { lijst_id: entry.id, titel: w.title, extra: extra, vinkjes: vinkjes, bron: flow.source, extern_id: w.id, omslag_url: w.coverUrl || null, tracklist: tracklist, volgorde: base + wi };
      if (flow.reeksId) row.reeks_id = flow.reeksId;
      else if (entry.genest && flow.source === 'discogs') {
        var n = (w.artist || '').trim();
        var rk = n ? reeksByName[normalizeReeksNaam(n)] : null;
        if (rk) row.reeks_id = rk.id;
      } else if (entry.genest && singleReeksId) {
        row.reeks_id = singleReeksId;
      }
      rows.push(row);
    }
    var result = await supabase.from('lijst_items').insert(rows);
    refetchSoft(result);
  }

  function renderImportSection(entry) {
    var wrap = document.createElement('div');
    var flow = state.importFlow;
    if (flow && flow.listId === entry.id && flow.source !== entry.auto_import) return wrap;
    if (!flow || flow.listId !== entry.id) {
      // Discogs' bulk-collectie-import stond eerder als los download-icoontje in de compacte
      // koprij (naast tandwiel/camera) — inconsistent met de rest van het "Toevoegen"-tabblad, waar
      // juist alle manieren om iets toe te voegen bij elkaar horen te staan. Nu net als Open Library
      // gewoon een knop hier, mits er al een Discogs-gebruikersnaam is ingevuld.
      if (entry.auto_import === 'discogs' && !entry.discogs_username) {
        var row2 = document.createElement('div'); row2.className = 'import-toggle-row';
        var hint = document.createElement('p'); hint.className = 'import-msg';
        hint.textContent = 'Vul je Discogs-gebruikersnaam in bij "Velden bewerken" om te kunnen importeren.';
        row2.appendChild(hint);
        wrap.appendChild(row2);
      } else {
        var row = document.createElement('div'); row.className = 'import-toggle-row';
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'btn-secondary'; btn.textContent = IMPORT_LABELS[entry.auto_import] || 'Toevoegen';
        btn.addEventListener('click', function () { openImportFlow(entry); });
        row.appendChild(btn);
        wrap.appendChild(row);
      }
      return wrap;
    }
    wrap.appendChild(buildImportPanel(entry));
    return wrap;
  }

  function buildImportPanel(entry) {
    var flow = state.importFlow;
    var panel = document.createElement('div'); panel.className = 'import-panel wide-row-content';
    var header = document.createElement('div'); header.className = 'import-actions';
    var titleSpan = document.createElement('strong');
    titleSpan.textContent = flow.reeksId ? ('Titels zoeken op ' + (REEKS_SEARCH_LABELS[flow.source] || flow.source)) : (IMPORT_LABELS[flow.source] || 'Toevoegen');
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button'; closeBtn.className = 'btn-text'; closeBtn.textContent = 'Sluiten';
    closeBtn.addEventListener('click', closeImportFlow);
    header.appendChild(titleSpan); header.appendChild(closeBtn);
    panel.appendChild(header);

    if (flow.step === 'search') {
      var searchRow = document.createElement('div'); searchRow.className = 'import-search';
      var input = document.createElement('input');
      input.type = 'text'; input.placeholder = entry.auto_import === 'openlibrary' ? 'Naam van de auteur' : 'Naam van de artiest';
      input.value = flow.query;
      var searchBtn = document.createElement('button');
      searchBtn.type = 'button'; searchBtn.className = 'btn-primary'; searchBtn.textContent = flow.loading ? 'Bezig…' : 'Zoeken';
      searchBtn.disabled = flow.loading;
      function go() { var v = input.value.trim(); if (v) importSearch(v); }
      searchBtn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      searchRow.appendChild(input); searchRow.appendChild(searchBtn);
      panel.appendChild(searchRow);
      setTimeout(function () { input.focus(); }, 0);
    } else if (flow.step === 'candidates') {
      var list = document.createElement('div'); list.className = 'import-candidates';
      flow.candidates.forEach(function (c) {
        var cb = document.createElement('button');
        cb.type = 'button'; cb.className = 'import-candidate';
        var nameEl = document.createElement('span'); nameEl.textContent = c.name;
        cb.appendChild(nameEl);
        if (c.meta) { var small = document.createElement('small'); small.textContent = c.meta; cb.appendChild(small); }
        cb.addEventListener('click', function () { importPickCandidate(c); });
        list.appendChild(cb);
      });
      panel.appendChild(list);
      var backToSearch = document.createElement('button');
      backToSearch.type = 'button'; backToSearch.className = 'btn-text'; backToSearch.textContent = '← Opnieuw zoeken';
      backToSearch.addEventListener('click', function () { flow.step = 'search'; flow.error = ''; renderDetail(); });
      panel.appendChild(backToSearch);
    } else if (flow.step === 'works') {
      if (flow.loading) {
        var loadingP = document.createElement('p'); loadingP.className = 'import-msg';
        loadingP.textContent = flow.source === 'discogs' ? 'Collectie ophalen…' : 'Bezig…';
        panel.appendChild(loadingP);
      } else {
        var sub = document.createElement('p'); sub.className = 'import-msg';
        var msg;
        if (flow.source === 'discogs') msg = flow.works.length + ' items gevonden in je Discogs-collectie.';
        else if (flow.source === 'openlibrary') msg = flow.works.length + (flow.note ? ' titels gevonden voor ' : ' Nederlandstalige titels gevonden voor ') + flow.candidateName + '.';
        else msg = flow.works.length + ' titels gevonden voor ' + flow.candidateName + '.';
        sub.textContent = msg + (flow.source === 'discogs' ? ' Vink uit wat je niet wilt toevoegen.' : ' Vink aan wat je wilt toevoegen.');
        panel.appendChild(sub);
        if (flow.note) {
          var noteP = document.createElement('p'); noteP.className = 'import-msg'; noteP.textContent = flow.note;
          panel.appendChild(noteP);
        }
        if (flow.source !== 'discogs' && flow.candidates.length > 1) {
          var backToCandidates = document.createElement('button');
          backToCandidates.type = 'button'; backToCandidates.className = 'btn-text';
          backToCandidates.textContent = '← Andere kandidaat proberen';
          backToCandidates.addEventListener('click', function () { flow.step = 'candidates'; flow.error = ''; flow.note = ''; renderDetail(); });
          panel.appendChild(backToCandidates);
        }
        var worksList = document.createElement('div'); worksList.className = 'import-works';
        flow.works.forEach(function (w) {
          var row = document.createElement('label'); row.className = 'import-work-row';
          var cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = flow.selected.has(w.id);
          cb.addEventListener('change', function () {
            if (cb.checked) flow.selected.add(w.id); else flow.selected.delete(w.id);
            addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
          });
          row.appendChild(cb);
          if (w.coverUrl) {
            var thumb = document.createElement('img'); thumb.className = 'import-work-thumb'; thumb.src = w.coverUrl; thumb.alt = ''; thumb.loading = 'lazy';
            row.appendChild(thumb);
          }
          var span = document.createElement('span');
          span.textContent = w.title + (w.artist ? ' — ' + w.artist : '') + (w.year ? ' (' + w.year + ')' : '');
          row.appendChild(span);
          worksList.appendChild(row);
        });
        panel.appendChild(worksList);
        var commitRow = document.createElement('div'); commitRow.className = 'import-actions';
        var addBtn = document.createElement('button');
        addBtn.type = 'button'; addBtn.className = 'btn-primary';
        addBtn.textContent = 'Toevoegen (' + flow.selected.size + ')';
        addBtn.disabled = !flow.works.length;
        addBtn.addEventListener('click', function () { importCommit(entry); });
        commitRow.appendChild(addBtn);
        panel.appendChild(commitRow);
      }
    }

    if (flow.error) {
      var errP = document.createElement('p'); errP.className = 'import-msg error'; errP.textContent = flow.error;
      panel.appendChild(errP);
    }

    return panel;
  }

  // ---------- Data ----------
  async function refetchAll() {
    var res = await Promise.all([
      supabase.from('lijsten').select('*').order('volgorde', { ascending: true }),
      supabase.from('lijst_items').select('*').order('volgorde', { ascending: true }),
      supabase.from('reeksen').select('*').order('volgorde', { ascending: true })
    ]);
    var lijstenRes = res[0], itemsRes = res[1], reeksenRes = res[2];
    if (lijstenRes.error || itemsRes.error || reeksenRes.error) {
      console.error(lijstenRes.error || itemsRes.error || reeksenRes.error);
      showStatus('Kon lijstjes niet laden. Controleer je verbinding.');
      return;
    }
    showStatus('');
    state.lijsten = lijstenRes.data || [];
    state.items = itemsRes.data || [];
    state.reeksen = reeksenRes.data || [];
    renderOverview();
    if (state.currentId) renderDetail();
  }
  function refetchSoft(result) {
    if (result && result.error) { console.error(result.error); window.alert('Er ging iets mis bij het opslaan.'); }
    return refetchAll();
  }

  function subscribeRealtime() {
    supabase.channel('lijstjeslijst_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijsten' }, refetchAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lijst_items' }, refetchAll)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reeksen' }, refetchAll)
      .subscribe();
  }

  function maybeShowInstallHint() {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    var dismissed = false;
    try { dismissed = localStorage.getItem('lijstjeslijst-install-hint-dismissed') === '1'; } catch (e) {}
    if (isIOS && !isStandalone && !dismissed) installHint.hidden = false;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').then(function (reg) {
        reg.update();
        setInterval(function () { reg.update(); }, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function (e) { console.error('SW registratie mislukt', e); });
      var refreshedAfterUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshedAfterUpdate) return;
        refreshedAfterUpdate = true;
        window.location.reload();
      });
    });
  }

  document.getElementById('app-version').textContent = 'v' + APP_VERSION;
  maybeShowInstallHint();
  showStatus('Lijstjes laden…');
  refetchAll();
  subscribeRealtime();
})();
</script>
</body>
